// ── Blip-A Eridian Probe Core ─────────────────────────────────────────────────
@PART[blipa_probe]:NEEDS[!CUSTOM_PHM_MODELS]
{
    !MODEL {}
    MODEL
    {
        model  = Squad/Parts/Command/probeCoreSphere_v2/probeCoreSphere_v2
