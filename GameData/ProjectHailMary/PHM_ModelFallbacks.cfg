// Project Hail Mary - Stock Model Fallbacks
// Parts that have custom .mu files exported from Unity no longer appear here.
// Remaining entries are parts whose custom models are still in progress.
//
// HOW TO REPLACE WITH UNITY MODELS:
//   1. Export your part from Unity PartTools as GameData/ProjectHailMary/Models/<name>.mu
//   2. Remove the corresponding @PART block below.
//   3. The part.cfg MODEL { model = ProjectHailMary/Models/<name> } is already correct.
//
// ── STATUS ──────────────────────────────────────────────────────────────────
//   hailmary_pod          ✅ Custom .mu committed — fallback removed
//   astrophage_drive       ✅ Custom .mu committed — fallback removed
//   astrophage_tank_large  ✅ Custom .mu committed — fallback removed
//   astrophage_tank_small  ✅ Custom .mu committed — fallback removed
//   blipa_probe            ⏳ Still using Probodobodyne Stayputnik stock model
//   petrova_spectrometer   ⏳ Still using PresMat Barometer stock model
//   rocky_comms_array      ⏳ Still using RA-100 Relay Antenna stock model
// ─────────────────────────────────────────────────────────────────────────────

// ── Blip-A Eridian Probe Core ─────────────────────────────────────────────────
@PART[blipa_probe]:NEEDS[!CUSTOM_PHM_MODELS]
{
    !MODEL {}
    MODEL
    {
        model  = Squad/Parts/Command/probeCoreSphere_v2/probeCoreSphere_v2
        scale  = 1.5, 1.5, 1.5
    }
}

// ── Petrova Astrophage Spectrometer ──────────────────────────────────────────
@PART[petrova_spectrometer]:NEEDS[!CUSTOM_PHM_MODELS]
{
    !MODEL {}
    MODEL
    {
        model  = Squad/Parts/Science/sensorBarometer/sensorBarometer
        scale  = 2.0, 2.0, 2.0
    }
}

// ── Eridian Communication Array "Rocky" ──────────────────────────────────────
@PART[rocky_comms_array]:NEEDS[!CUSTOM_PHM_MODELS]
{
    !MODEL {}
    MODEL
    {
        model  = Squad/Parts/Utility/commDish88-88/commDish88-88
        scale  = 1.0, 1.0, 1.0
    }
}
