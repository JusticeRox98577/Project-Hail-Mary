// Project Hail Mary - Stock Model Fallbacks
// Every custom part references a .mu that doesn't exist yet.
// This file patches each part to use a visually similar stock model so all parts
// are visible and functional in the VAB immediately.
//
// HOW TO REPLACE WITH UNITY MODELS:
//   1. Export your part from Unity PartTools as GameData/ProjectHailMary/Models/<name>.mu
//   2. Remove the corresponding @PART block below (or delete this whole file when all
//      custom models exist).
//
// Stock model paths used (all KSP 1.12 stock, no DLC required):
//   hailmary_pod        → Mk1-3 Command Pod      (3-man capsule)
//   astrophage_drive    → S3 KS-25×4 Mammoth      (4-nozzle engine cluster)
//   astrophage_tank_large → Kerbodyne S3-14400    (large 3.75m tank)
//   astrophage_tank_small → Kerbodyne S3-7500     (medium 3.75m tank)
//   blipa_probe         → Probodobodyne Stayputnik (sphere probe)
//   petrova_spectrometer  → PresMat Barometer     (science instrument)
//   rocky_comms_array   → RA-100 Relay Antenna    (large dish)

// ── Hail Mary Command Module ─────────────────────────────────────────────────
@PART[hailmary_pod]:NEEDS[!CUSTOM_PHM_MODELS]
{
    !MODEL {}
    MODEL
    {
        model  = Squad/Parts/CommandPods/mk1-3pod/mk1-3pod
        scale  = 1.4, 1.8, 1.4
    }
}

// ── Astrophage Photon Drive ───────────────────────────────────────────────────
@PART[astrophage_drive]:NEEDS[!CUSTOM_PHM_MODELS]
{
    !MODEL {}
    MODEL
    {
        model  = Squad/Parts/Engine/Size3EngineCluster/Size3EngineCluster
        scale  = 1.0, 1.0, 1.0
    }
}

// ── Astrophage Storage Tank (Large) ──────────────────────────────────────────
@PART[astrophage_tank_large]:NEEDS[!CUSTOM_PHM_MODELS]
{
