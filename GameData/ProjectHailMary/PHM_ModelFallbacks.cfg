// ── Petrova Astrophage Spectrometer ──────────────────────────────────────────
@PART[petrova_spectrometer]:NEEDS[!CUSTOM_PHM_MODELS]
{
    !MODEL {}
    MODEL
    {
        model  = Squad/Parts/Science/sensorBarometer/sensorBarometer
        scale  = 2.0, 2.0, 2.0
    }
}

// ── Eridian Communication Array "Rocky" ──────────────────────────────────────
@PART[rocky_comms_array]:NEEDS[!CUSTOM_PHM_MODELS]
{
    !MODEL {}
    MODEL
    {
        model  = Squad/Parts/Utility/commDish88-88/commDish88-88
        scale  = 1.0, 1.0, 1.0
    }
}
