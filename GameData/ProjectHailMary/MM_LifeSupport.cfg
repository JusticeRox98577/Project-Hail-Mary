// Project Hail Mary - Life Support Compatibility Patches
// Optional patches for popular life support mods.
// These activate automatically if the target mod is installed.

// ── TAC Life Support ──────────────────────────────────────────────────────────

@PART[hailmary_pod]:NEEDS[TacLifeSupport]
{
    MODULE
    {
        name = LifeSupportModule
    }

    // TAC-LS resource amounts for 13-year transit (hibernation — very low consumption)
    @RESOURCE[Food]
    {
        @amount    = 14400   // 13 years at hibernate rate
        @maxAmount = 14400
    }
    @RESOURCE[Water]
    {
        @amount    = 9600
        @maxAmount = 9600
    }
    @RESOURCE[Oxygen]
    {
        @amount    = 120000
        @maxAmount = 120000
    }

    MODULE
    {
        name = TacGenericConverter
        converterName = CO2 Scrubber
        conversionRate = 0.001
        inputResources = CarbonDioxide, 0.001, ElectricCharge, 0.01
        outputResources = Waste, 0.0008, false
    }
}

// ── Kerbalism ────────────────────────────────────────────────────────────────

@PART[hailmary_pod]:NEEDS[Kerbalism]
{
    // Kerbalism's hibernation support — nearly zero resource drain in coma
    MODULE
    {
        name = Hibernate
        ec_rate = 0.002
    }

    // Radiation shielding — the Hail Mary hull was designed to survive 13 years
    // of interstellar cosmic ray exposure
    MODULE
    {
        name = Emitter
        radiation = -0.0000005   // strong shielding
    }
}

// ── USI Life Support ─────────────────────────────────────────────────────────

@PART[hailmary_pod]:NEEDS[USILifeSupport]
{
    @RESOURCE[Food]
    {
        @amount    = 22000
        @maxAmount = 22000
    }

    MODULE
    {
        name = USI_SwapController
    }
}
