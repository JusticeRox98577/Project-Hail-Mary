// Project Hail Mary - Astrophage Drive

PART
{
    name = astrophage_drive
    module = Part
    author = ProjectHailMary

    MODEL
    {
        model = ProjectHailMary/Models/astrophage_drive
        scale = 1.0, 1.0, 1.0
    }

    rescaleFactor = 1.0

    node_stack_top    = 0.0,  1.9, 0.0, 0.0,  1.0, 0.0, 2
    node_stack_bottom = 0.0, -2.8, 0.0, 0.0, -1.0, 0.0, 2
    node_attach       = 0.0,  1.9, 0.0, 0.0,  1.0, 0.0

    TechRequired = nuclearPropulsion
    entryCost = 750000
    cost = 380000
    category = Engine
    subcategory = 0
    title = Astrophage Photon Drive
    manufacturer = Project Hail Mary Mission Authority
    description = The revolutionary propulsion system at the heart of the Hail Mary mission. Astrophage organisms are induced to emit stored energy directionally, producing a photon rocket with extraordinary specific impulse. Requires Astrophage fuel.

    attachRules = 1,0,1,0,0

    mass = 3.0
    dragModelType = default
    maximum_drag = 0.20
    minimum_drag = 0.15
    angularDrag = 2
    crashTolerance = 12
    breakingForce = 200
    breakingTorque = 200
    maxTemp = 4000
    skinMaxTemp = 4000
    heatConductivity = 0.06
    emissiveConstant = 0.95

    // Main engine — provides actual thrust
    MODULE
    {
        name = ModuleEnginesFX
        thrustVectorTransformName = thrustTransform
        exhaustDamage = True
        ignitionThreshold = 0.1
        minThrust = 0
        maxThrust = 1800
        heatProduction = 25
        fxOffset = 0, 0, 0.8
        EngineType = LiquidFuel
        exhaustDamageDistanceOffset = 1.5
        engageEffectName = engage
        flameoutEffectName = flameout
        powerEffectName = running_closed
        runningEffectName = running_closed

        atmosphereCurve
        {
            key = 0 85000
            key = 1 2000
            key = 4 0.001
        }

        PROPELLANT
        {
            name = Astrophage
            ratio = 1.0
            DrawGauge = True
        }

        PROPELLANT
        {
            name = ElectricCharge
            ratio = 2.0
        }
    }

    // Custom module — handles breeding mode and engine glow (requires ProjectHailMary.dll)
    MODULE
    {
        name = ModuleAstrophageDrive
        thrustVectorTransformName = thrustTransform
        maxThrust = 1800
        minThrust = 0
        astrophageConsumptionRate = 0.00012
        breedingRate = 0.002
        breedingMinFlux = 200

        atmosphereCurve
        {
            key = 0 85000
            key = 1 2000
            key = 4 0.001
        }

        PROPELLANT
        {
            name = Astrophage
            ratio = 1.0
            DrawGauge = True
        }
    }

    MODULE
    {
        name = ModuleGimbal
        gimbalTransformName = thrustTransform
        gimbalRange = 1.5
        useGimbalResponseSpeed = true
        gimbalResponseSpeed = 8
    }

    MODULE
    {
        name = ModuleAlternator
        RESOURCE
        {
            name = ElectricCharge
            rate = 12.0
        }
    }

    EFFECTS
    {
        running_closed
        {
            AUDIO
            {
                channel = Ship
                clip = Squad/Sounds/sound_rocket_spurts
                volume = 0.0 0.0
                volume = 0.05 0.6
                volume = 1.0 1.5
                pitch = 0.0 1.2
                pitch = 1.0 2.0
                loop = true
            }
            MODEL_MULTI_PARTICLE
            {
                name = astrophage_plume
                modelName = Squad/FX/shockExhaust_blue_small
                transformName = thrustTransform
                emission = 0.0 0.0
                emission = 0.05 0.0
                emission = 0.075 0.25
                emission = 1.0 1.25
                speed = 0.0 0.5
                speed = 1.0 1.2
                localRotation = -90, 0, 0
                localPosition = 0, 0, 0
            }
        }
        engage
        {
            AUDIO
            {
                channel = Ship
                clip = Squad/Sounds/sound_vent_medium
                volume = 1.0
                pitch = 2.0
                loop = false
            }
        }
        flameout
        {
            PREFAB_PARTICLE
            {
                prefabName = fx_exhaustSparks_flameout
                transformName = thrustTransform
                oneShot = true
            }
            AUDIO
            {
                channel = Ship
                clip = Squad/Sounds/sound_explosion_low
                volume = 1.0
                pitch = 2.0
                loop = false
            }
        }
    }
}
