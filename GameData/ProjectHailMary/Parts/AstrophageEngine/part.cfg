// Project Hail Mary - Astrophage Drive
// The Astrophage drive uses living organisms that consume light and emit
// it directionally, producing thrust via radiation pressure at near-perfect
// efficiency. ISP is effectively defined by the speed of light.
// Real-world equivalent ISP ≈ 30,000,000 s. Scaled for KSP gameplay.

PART
{
    name = astrophage_drive
    module = Part
    author = ProjectHailMary

    MODEL
    {
        model = Squad/Parts/Engine/liquidEngineLV-N/liquidEngineLV-N/nuclearEngine
        scale = 2.5, 2.5, 2.5
    }

    rescaleFactor = 1.0

    node_stack_top    = 0.0,  2.2, 0.0, 0.0,  1.0, 0.0, 2
    node_stack_bottom = 0.0, -2.2, 0.0, 0.0, -1.0, 0.0, 2

    TechRequired = nuclearPropulsion
    entryCost = 750000
    cost = 380000
    category = Engine
    subcategory = 0
    title = Astrophage Photon Drive
    manufacturer = Project Hail Mary Mission Authority
    description = The revolutionary propulsion system at the heart of the Hail Mary mission. Astrophage organisms are bred in tanks, fed stellar radiation, and then induced to emit their stored energy directionally out the drive nozzle. The result is a photon rocket with a specific impulse that makes chemical engines look like fireworks. Thrust is modest by rocket standards but sustained over months produces extraordinary delta-v. Requires Astrophage fuel.

    attachRules = 1,0,1,0,0

    mass = 6.8
    dragModelType = default
    maximum_drag = 0.20
    minimum_drag = 0.15
    angularDrag = 2
    crashTolerance = 12
    breakingForce = 200
    breakingTorque = 200
    maxTemp = 4000
    skinMaxTemp = 4000
    heatConductivity = 0.06
    emissiveConstant = 0.95

    // Custom engine module defined in ProjectHailMary.dll
    MODULE
    {
        name = ModuleAstrophageDrive
        thrustVectorTransformName = thrustTransform

        // Thrust is intentionally low — this is a sustained-thrust drive
        // like Dawn or VASIMR, not a launch rocket.
        // The Hail Mary achieved ~1.5g of thrust over months.
        // Scaled: 450 kN peak, Isp 85,000 s for KSP balance
        maxThrust = 450
        minThrust = 0

        // ISP scaled to be dramatically better than any stock engine
        // while not breaking KSP's floating-point physics at kerbal scales.
        // Real value would be ~30,000,000 s.
        atmosphereCurve
        {
            key = 0 85000
            key = 1 800
            key = 4 0.001
        }

        PROPELLANT
        {
            name = Astrophage
            ratio = 1.0
            DrawGauge = True
        }

        // Glow effect — Astrophage emits characteristic orange light
        engageEffectName = engage
        flameoutEffectName = flameout
        powerEffectName = running_closed
        runningEffectName = running_closed
    }

    // Fallback stock engine for compatibility if plugin not installed
    MODULE
    {
        name = ModuleEnginesFX
        thrustVectorTransformName = thrustTransform
        exhaustDamage = True
        ignitionThreshold = 0.1
        minThrust = 0
        maxThrust = 450
        heatProduction = 25
        fxOffset = 0, 0, 0.8
        EngineType = LiquidFuel
        exhaustDamageDistanceOffset = 1.5

        atmosphereCurve
        {
            key = 0 85000
            key = 1 800
            key = 4 0.001
        }

        PROPELLANT
        {
            name = Astrophage
            ratio = 1.0
            DrawGauge = True
        }

        PROPELLANT
        {
            name = ElectricCharge
            ratio = 10.0
        }
    }

    MODULE
    {
        name = ModuleGimbal
        gimbalTransformName = thrustTransform
        gimbalRange = 1.5
        useGimbalResponseSpeed = true
        gimbalResponseSpeed = 8
    }

    MODULE
    {
        name = ModuleAlternator
        RESOURCE
        {
            name = ElectricCharge
            rate = 12.0
        }
    }

    MODULE
    {
        name = ModuleTestSubject
        useStaging = True
        useEvent = True
        situationMask = 127
        CONSTRAINT { type = REPEATABILITY; value = ALWAYS; prestige = Trivial; }
        CONSTRAINT { type = REPEATABILITY; value = BODYANDSITUATION; prestige = Significant; }
        CONSTRAINT { type = REPEATABILITY; value = ONCEPERPART; prestige = Exceptional; }
        CONSTRAINT { type = ALTITUDEENV; test = GT; value = 4000; prestige = Trivial; }
        CONSTRAINT { type = ALTITUDEENV; test = LT; value = 8000; prestige = Trivial; }
        CONSTRAINT { type = ALTITUDEENV; test = GT; value = 2000; prestige = Significant; }
        CONSTRAINT { type = ALTITUDEENV; test = LT; value = 4000; prestige = Significant; }
        CONSTRAINT { type = ALTITUDEENV; test = GT; value = 1000; prestige = Exceptional; }
        CONSTRAINT { type = ALTITUDEENV; test = LT; value = 2000; prestige = Exceptional; }
        CONSTRAINT { type = REPEAT; value = 2; prestige = Trivial; }
        CONSTRAINT { type = REPEAT; value = 1; prestige = Significant; }
        CONSTRAINT { type = MASS; test = LT; value = 40; transform = false; combined = false; prestige = Trivial; }
        CONSTRAINT { type = MASS; test = LT; value = 35; transform = false; combined = false; prestige = Significant; }
        CONSTRAINT { type = MASS; test = LT; value = 25; transform = false; combined = false; prestige = Exceptional; }
        CONSTRAINT { type = SITUATION; value = FLYING; prestige = Trivial; body = Kerbin; }
        CONSTRAINT { type = SITUATION; value = SUB_ORBITAL; body = Kerbin; }
        CONSTRAINT { type = SITUATION; value = ORBITING; body = Kerbin; }
        CONSTRAINT { type = SITUATION; value = ESCAPING; body = Kerbin; }
    }

    EFFECTS
    {
        running_closed
        {
            AUDIO
            {
                channel = Ship
                clip = Squad/Sounds/sound_rocket_spurts
                volume = 0.0 0.0
                volume = 0.05 0.6
                volume = 1.0 1.5
                pitch = 0.0 1.2
                pitch = 1.0 2.0
                loop = true
            }
            MODEL_MULTI_PARTICLE
            {
                name = astrophage_plume
                modelName = Squad/FX/shockExhaust_blue_small
                transformName = thrustTransform
                emission = 0.0 0.0
                emission = 0.05 0.0
                emission = 0.075 0.25
                emission = 1.0 1.25
                speed = 0.0 0.5
                speed = 1.0 1.2
                localRotation = -90, 0, 0
                localPosition = 0, 0, 0
            }
            MODEL_MULTI_PARTICLE
            {
                name = astrophage_glow
                modelName = Squad/FX/exhaustSparks_flameout_2
                transformName = thrustTransform
                emission = 0.0 0.0
                emission = 0.05 0.0
                emission = 0.25 0.5
                emission = 1.0 1.2
                speed = 0.0 0.5
                speed = 1.0 1.2
                localRotation = -90, 0, 0
            }
        }
        engage
        {
            AUDIO
            {
                channel = Ship
                clip = Squad/Sounds/sound_vent_medium
                volume = 1.0
                pitch = 2.0
                loop = false
            }
        }
        flameout
        {
            PREFAB_PARTICLE
            {
                prefabName = fx_exhaustSparks_flameout
                transformName = thrustTransform
                oneShot = true
            }
            AUDIO
            {
                channel = Ship
                clip = Squad/Sounds/sound_explosion_low
                volume = 1.0
                pitch = 2.0
                loop = false
            }
        }
    }
}
