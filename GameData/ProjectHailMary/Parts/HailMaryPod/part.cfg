// Project Hail Mary - Hail Mary Command Module
// The Hail Mary is a cylinder roughly 12m long and 4m wide.
// The pilot's chamber is a small rounded room at one end.
// Grace spent most of his journey in a coma in this pod.

PART
{
    name = hailmary_pod
    module = Part
    author = ProjectHailMary

    MODEL
    {
        model = ProjectHailMary/Models/hailmary_pod
        scale = 1.4, 1.8, 1.4
    }

    rescaleFactor = 1.0

    // Mk1-3 model native height ~2.7m, scaled 1.8x = ~4.9m total.
    // Bottom node sits at the docking/decoupler ring, top is the nose.
    node_stack_bottom = 0.0, -2.0, 0.0, 0.0, -1.0, 0.0, 2
    node_stack_top    = 0.0,  2.4, 0.0, 0.0,  1.0, 0.0, 1
    node_attach       = 0.0, -2.0, 0.0, 0.0, -1.0, 0.0

    TechRequired = advancedFlightControl
    entryCost = 280000
    cost = 140000
    category = Pods
    subcategory = 0
    title = Hail Mary Command Module
    manufacturer = Project Hail Mary Mission Authority
    description = The single-crew command module of the Hail Mary spacecraft. Contains a full medical bay, coma-maintenance system, and long-duration life support for a mission to another star. Dr. Ryland Grace woke up here with no memory of who he was or why he was alone. Includes an integrated Astrophage culture chamber for the AstrophageSeed science payload.

    attachRules = 1,0,1,1,0

    mass = 15.0
    dragModelType = default
    maximum_drag = 0.20
    minimum_drag = 0.15
    angularDrag = 2
    crashTolerance = 45
    breakingForce = 200
    breakingTorque = 200
    maxTemp = 3200
    skinMaxTemp = 3200
    vesselType = Ship
    CrewCapacity = 1

    INTERNAL
    {
        name = Mk1-3InternalCamera
    }

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0   // autonomous — Grace was in coma
        hasHibernation = true
        hibernationMultiplier = 0.004
        defaultControlPointDisplayName = #autoLOC_6011003

        CONTROLPOINT
        {
            name = default
            displayName = #autoLOC_6011003
            orientation = 0,0,0
        }
    }

    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 3
    }

    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 30
        YawTorque = 30
        RollTorque = 30

        RESOURCE
        {
            name = ElectricCharge
            rate = 1.2
        }
    }

    MODULE
    {
        name = ModuleScienceContainer
        reviewActionName = Review Data
        storeActionName = Store Experiments
        collectActionName = Take Data
        allowReviewingFiles = true
        allowRepeatedSubjects = true
    }

    // Coma life support system — very low EC draw when hibernating
    MODULE
    {
        name = ModuleGenerator
        isAlwaysActive = false
        activateGUIName = Activate Life Support
        shutdownGUIName = Shutdown Life Support
        OUTPUT_RESOURCE
        {
            name = ElectricCharge
            rate = -0.08
        }
    }

    RESOURCE
    {
        name = ElectricCharge
        amount = 5000
        maxAmount = 5000
    }

    RESOURCE
    {
        name = Food
        amount = 1800
        maxAmount = 1800
    }

    RESOURCE
    {
        name = Water
        amount = 1200
        maxAmount = 1200
    }

    RESOURCE
    {
        name = Oxygen
        amount = 15000
        maxAmount = 15000
    }

    RESOURCE
    {
        name = CarbonDioxide
        amount = 0
        maxAmount = 5000
    }

    RESOURCE
    {
        name = Waste
        amount = 0
        maxAmount = 500
    }

    RESOURCE
    {
        name = WasteWater
        amount = 0
        maxAmount = 500
    }

    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = astrophage_culture
        experimentActionName = Study Astrophage Culture
        resetActionName = Reset Culture Chamber
        reviewActionName = Review Culture Data
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = False
        rerunnable = true
        resettable = false
        resettableOnEVA = false
        dataIsCollectable = true
        collectActionName = Collect Culture Data
        interactionRange = 1.5
        xmitDataScalar = 0.6
    }

    // Astrophage culture seed — the whole point of the mission
    RESOURCE
    {
        name = AstrophageSeed
        amount = 10
        maxAmount = 10
    }

    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = DIRECT
        packetInterval = 0.18
        packetSize = 2
        packetResourceCost = 24.0
        requiredResource = ElectricCharge
        antennaPower = 5000000000000   // 5 Terawatt-equivalent — deep space rated
        optimumRange = 4000000000000
        packetFloor = 0.1
        packetCeiling = 5
    }
}
