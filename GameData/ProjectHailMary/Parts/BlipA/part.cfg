// Project Hail Mary - Blip-A Eridian Probe
// Rocky (an Eridian from Tau Ceti e) arrived near the Hail Mary aboard the Blip-A.
// Eridians build ships differently: no seats, no screens, no pressurized cabin.
// The Blip-A is a dense cluster of modules and tanks shaped like an oblate disc.
// Rocky navigated by sensing pressure waves through the hull and direct neural links.
// The two ships worked together to find a solution to the Astrophage crisis.

PART
{
    name = blipa_probe
    module = Part
    author = ProjectHailMary

    MODEL
    {
        model = ProjectHailMary/Models/blipa_probe
        scale = 1.0, 1.0, 1.0
    }

    rescaleFactor = 1.0

    node_stack_bottom = 0.0, -0.4, 0.0, 0.0, -1.0, 0.0, 1
    node_attach       = 0.0, -0.4, 0.0, 0.0, -1.0, 0.0

    TechRequired = eridianTechnology
    entryCost = 500000
    cost = 260000
    category = Pods
    subcategory = 0
    title = Blip-A Eridian Probe Core
    manufacturer = Joint Human-Eridian Engineering (Rocky & Grace)
    description = A reverse-engineered Eridian probe core, built from Rocky's schematics. The Eridians never developed screens or keyboards — they interface with machines directly through pressure-wave organs. This module mimics the Blip-A's control architecture using Kerbalized equivalents. Extremely radiation-hardened. Can operate for centuries without maintenance. Rocky would find our buttons hilarious. "Funny soft!"

    attachRules = 1,1,1,1,0

    mass = 0.6
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.15
    angularDrag = 1
    crashTolerance = 60
    breakingForce = 300
    breakingTorque = 300
    maxTemp = 3500
    skinMaxTemp = 3500
    vesselType = Probe
    CrewCapacity = 0

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        hasHibernation = true
        hibernationMultiplier = 0.00001    // Eridian electronics are absurdly efficient
        defaultControlPointDisplayName = Blip-A Core

        CONTROLPOINT
        {
            name = default
            displayName = Blip-A Core
            orientation = 0,0,0
        }
    }

    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 3
    }

    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 15
        YawTorque = 15
        RollTorque = 15

        RESOURCE
        {
            name = ElectricCharge
            rate = 0.25
        }
    }

    // Eridian pressure-wave comms — faster data rate than anything humans built
    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = DIRECT
        packetInterval = 0.1
        packetSize = 16.0
        packetResourceCost = 48.0
        requiredResource = ElectricCharge
        antennaPower = 400000000000000
        optimumRange = 200000000000000
        packetFloor = 0.05
        packetCeiling = 10
    }

    MODULE
    {
        name = ModuleScienceContainer
        reviewActionName = Review Data
        storeActionName = Store Experiments
        collectActionName = Take Data
        allowReviewingFiles = true
        allowRepeatedSubjects = true
    }

    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = eridian_linguistics
        experimentActionName = Establish Eridian Link
        resetActionName = Reset Comms Protocol
        reviewActionName = Review Transmission
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = False
        rerunnable = true
        resettable = true
        resettableOnEVA = false
        dataIsCollectable = true
        collectActionName = Collect Data
        interactionRange = 1.5
        xmitDataScalar = 0.95
    }

    RESOURCE
    {
        name = ElectricCharge
        amount = 2000
        maxAmount = 2000
    }
}
