// Project Hail Mary - World Map Texture References
// Applied once textures exist in GameData/ProjectHailMary/Textures/
// Generated by: python Tools/generate_world_maps.py
//
// Each block patches the matching Kopernicus body to add:
//   ScaledVersion Material → texture (color map) + normals (normal map)
//   PQS Mods              → VertexColorMap (surface color from texture)
//                         → VertexHeightMap (terrain deformation from height map)
//
// The VertexSimplexNoiseColor mods (order 200) remain as fallback if textures
// are missing. VertexColorMap runs at order 201 and overwrites when present.

// ── Tau Ceti e ────────────────────────────────────────────────────────────────
@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = TauCetiE

        ScaledVersion
        {
            Material
            {
                texture = ProjectHailMary/Textures/TauCetiE_color
                normals = ProjectHailMary/Textures/TauCetiE_normal
            }
        }

        PQS
        {
            Mods
            {
                VertexColorMap
                {
                    map     = ProjectHailMary/Textures/TauCetiE_color
                    order   = 201
                    enabled = true
                }
                VertexHeightMap
                {
                    map                    = ProjectHailMary/Textures/TauCetiE_height
                    offset                 = 0
                    deformity              = 6000
                    scaleDeformityByRadius = false
                    order                  = 20
                    enabled                = true
                }
            }
        }
    }
}

