// Project Hail Mary - 40 Eridani A Star
// 40 Eridani (Omicron² Eridani / Keid) is a triple star system 16.3 light-years
// from Earth. The primary, 40 Eridani A, is a K1V main-sequence star:
//   Mass:   0.84 M☉
//   Radius: 0.72 R☉  (~501,000 km)
//   Temp:   ~5040 K  (more orange than Sol)
//   Lum:    0.46 L☉
//
// This is the home system of the Eridians — Rocky's people.
// Like Tau Ceti, 40 Eridani A is under siege by Astrophage.
// The Eridians evolved to understand and exploit Astrophage, and sent Rocky
// across 16 light-years in a Blip-A probe to find anyone with a solution.

@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = FortyEridani
        finalizeOrbit = false
        flightGlobalsIndex = 200

        Template
        {
            name = Sun
            removePQSMods = true
            removeAllPQSMods = true
        }

        Orbit
        {
            referenceBody            = Sun
            semiMajorAxis            = 24000000000000
            eccentricity             = 0.0
            inclination              = 5.5
            meanAnomalyAtEpoch       = 3.1
            longitudeOfAscendingNode = 110.0
            argumentOfPeriapsis      = 0.0
            epoch                    = 0
        }

        Properties
        {
            displayName    = 40 Eridani
            description    = A K-type main-sequence star 16.3 light-years from the Solar System — cooler, dimmer, and more orange than Kerbol. Its spectral class puts it just below the Sun on the main sequence, with roughly half the luminosity. This is the home system of the Eridian species. Rocky — the Eridian explorer who rendezvoused with the Hail Mary near Tau Ceti — was born in this system. His people discovered Astrophage long before humans did, and developed the Blip-A probe as an autonomous emissary. They sent Rocky across 16 light-years not as a scientist but as a last resort. The Astrophage infestation around 40 Eridani is just as catastrophic as the one consuming Tau Ceti.
            radius         = 501000000
            rotationPeriod = 91800
            tidallyLocked  = false
            isHomeWorld    = false

            ScienceValues
            {
                inSpaceLowDataValue  = 20
                inSpaceHighDataValue = 16
                recoveryValue        = 1
                spaceAltitudeThreshold = 2000000000
            }
        }

        Atmosphere
        {
            enabled = false
        }
    }
}
