// Project Hail Mary - 40 Eridani Planetary System
// The 40 Eridani A star hosts at least one confirmed planet.
// For this mod, three planets are included:
//   FortyEridaniI  — inner hot rock, too close to the star
//   EridianHome    — Rocky's homeworld, dense methane-ammonia atmosphere, ~360K surface
//   FortyEridaniIII — outer cold world, thin CO2 atmosphere
//
// NOTE: Eridians evolved on EridianHome. Their biology runs hot (~96°C body temp),
// they breathe a methane-ammonia mix, and they "see" with amulti-spectrum
// pressure-wave sense. They discovered Astrophage before humans and developed
// technology to exploit it. Rocky is the only known survivor of the first
// Eridian interstellar mission.

// ── 40 Eridani I (inner hot rock) ────────────────────────────────────────────
@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = FortyEridaniI
        finalizeOrbit = false
        flightGlobalsIndex = 202

        Template
        {
            name = Moho
            removePQSMods = false
        }

        Orbit
        {
            referenceBody            = FortyEridani
            semiMajorAxis            = 4500000000
            eccentricity             = 0.06
            inclination              = 1.1
            meanAnomalyAtEpoch       = 0.8
            longitudeOfAscendingNode = 60.0
            argumentOfPeriapsis      = 30.0
            epoch                    = 0
            color                    = 0.85, 0.45, 0.20, 1.0
        }

        Properties
        {
            displayName    = 40 Eridani I
            description    = The innermost planet of the 40 Eridani A system. A scorched, airless rock battered by the K-dwarf's radiation and Astrophage alike. The Eridians surveyed this world early in their spacefaring history and found nothing of interest — too hot, too barren, too close to the star's Petrova Line to be safely approached without heavy shielding.
            radius         = 300000
            mass           = 8.5e22
            rotationPeriod = 490000
            tidallyLocked  = true
            isHomeWorld    = false
            ScienceValues
            {
                flyingLowDataValue   = 0
                flyingHighDataValue  = 0
                inSpaceLowDataValue  = 7
                inSpaceHighDataValue = 4
                onGroundDataValue    = 10
                recoveryValue        = 3
                spaceAltitudeThreshold = 80000
            }
        }

        ScaledVersion
        {
            Material
            {
                color = 0.70, 0.35, 0.15, 1.0
            }
        }

        PQS
        {
            Mods
            {
                VertexSimplexNoiseColor
                {
                    seed        = 15
                    blend       = 0.85
                    colorStart  = 0.50, 0.20, 0.08, 1.0
                    colorEnd    = 0.82, 0.42, 0.15, 1.0
                    octaves     = 12.0
                    persistence = 0.5
                    frequency   = 3.0
                    order       = 200
                    enabled     = true
                }
            }
        }
    }
}

// ── Eridian Home (Rocky's homeworld, dense methane-ammonia atmosphere) ────────
@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = EridianHome
        finalizeOrbit = false
        flightGlobalsIndex = 201

        Template
        {
            name = Eve
            removePQSMods = false
        }

        Orbit
        {
            referenceBody            = FortyEridani
            semiMajorAxis            = 11000000000
            eccentricity             = 0.05
            inclination              = 0.7
            meanAnomalyAtEpoch       = 1.9
            longitudeOfAscendingNode = 130.0
            argumentOfPeriapsis      = 55.0
            epoch                    = 0
            color                    = 0.80, 0.60, 0.30, 1.0
        }

        Properties
        {
            displayName    = Erid
            description    = The homeworld of the Eridian species — Rocky's planet. Designated Erid. The closest planet to 40 Eridani A, completing an orbit every 42 days. From orbit, Erid is a dense, cloudy orange-brown ball — the color of strong ammonia smog choking the planet from pole to pole at 28 atmospheres of surface pressure. Below the clouds, the surface is a pitch-black volcanic landscape existing in permanent deep-ocean twilight. Almost no light from 40 Eridani A reaches the ground through the thick smog layer; molten rivers provide the only illumination. The Eridians evolved in this crushing, lightless, boiling-hot environment and built a civilization capable of interstellar travel. Rocky left this world willingly. Whether that says more about the universe or about Eridians is an open question.
            radius         = 650000
            mass           = 7.2e23
            rotationPeriod = 82800
            tidallyLocked  = false
            initialRotation = 20
            isHomeWorld    = false
            atmosphere     = true
            timewarpAltitudeLimits = 0 1000 6000 20000 60000 100000 200000 400000

            ScienceValues
            {
                flyingLowDataValue   = 16
                flyingHighDataValue  = 12
                inSpaceLowDataValue  = 14
                inSpaceHighDataValue = 10
                onGroundDataValue    = 20
                recoveryValue        = 10
                spaceAltitudeThreshold = 350000
            }
        }

        Atmosphere
        {
            enabled          = true
            oxygen           = false
            altitude         = 90000
            atmosphereDepth  = 90000
            pressureCurve
            {
                key = 0      152.0    0             0
                key = 10000   42.5   -0.009        -0.009
                key = 35000   4.2    -0.0003       -0.0003
                key = 70000   0.15   -0.00001      -0.00001
                key = 90000   0      0             0
            }
            temperatureCurve
            {
                key = 0      360   0        0
                key = 20000  280   -0.004   -0.004
                key = 60000  240   0.001    0.001
                key = 90000  160   0        0
            }
            temperatureSunMultCurve
            {
                key = 0      1     0      0
                key = 90000  0     0      0
            }
            atmosphericMolarMass = 0.016
            adiabaticIndex = 1.30
            gasMassLapseRate = 2
            atmospherePressureSeaLevel = 152000

            AtmosphereFromGround
            {
                DEBUG_alwaysUpdateAll = false
                doScale              = true
                innerRadius          = 650000
                invWaveLength        = 2.5, 3.8, 7.5, 0.5
                outerRadius          = 715000
                samples              = 4
                scale                = 0.0000111
                scaleDepth           = 0.25
                scaleOverScaleDepth  = 0.0000444
                ESun                 = 12.0
                Kr                   = 0.00100
                Km                   = 0.0035
                g                    = -0.80
                waveLength           = 0.680, 0.560, 0.440, 0.0
                outerRadiusMult      = 1.0125
                innerRadiusMult      = 0.975
            }
        }

        ScaledVersion
        {
            Material
            {
                color = 0.72, 0.52, 0.22, 1.0
            }
        }

        PQS
        {
            Mods
            {
                VertexSimplexNoiseColor
                {
                    seed        = 67
                    blend       = 0.80
                    colorStart  = 0.40, 0.28, 0.08, 1.0
                    colorEnd    = 0.65, 0.45, 0.15, 1.0
                    octaves     = 12.0
                    persistence = 0.5
                    frequency   = 2.0
                    order       = 200
                    enabled     = true
                }
            }
        }
    }
}

// ── 40 Eridani III (outer cold world) ────────────────────────────────────────
