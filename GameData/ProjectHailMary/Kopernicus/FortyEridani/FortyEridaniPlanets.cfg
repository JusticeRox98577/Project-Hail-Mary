// Project Hail Mary — 40 Eridani Planetary System
// Visual overhaul: ScaledVersion textures + PQS color/height maps from DDS files.
//
// EridianHome (Erid) maps to the confirmed planet 40 Eridani b:
//   8.47 M_Earth, P = 42.37 d, a = 0.2413 AU (Endl et al. 2018 / Feng et al. 2017)
// Radii from r/r_E = (m/m_E)^0.27. KSP scale factor: 0.09417 (radius), 0.00886 (mass).
// Orbital distances computed from real periods with GM_40Eri = 0.84 * GM_Kerbol.

// ── 40 Eridani I (hot inner rock, airless) ────────────────────────────────────
// Estimated: 1.5 M_Earth, P ≈ 15 d
@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = FortyEridaniI
        finalizeOrbit = false
        flightGlobalsIndex = 202

        Template
        {
            name = Moho
            removePQSMods = true
        }

        Orbit
        {
            referenceBody            = FortyEridani
            semiMajorAxis            = 3474000000
            eccentricity             = 0.06
            inclination              = 1.1
            meanAnomalyAtEpoch       = 0.8
            longitudeOfAscendingNode = 60.0
            argumentOfPeriapsis      = 30.0
            epoch                    = 0
            color                    = 0.75, 0.35, 0.12, 1.0
        }

        Properties
        {
            displayName    = 40 Eridani I
            description    = The innermost planet of the 40 Eridani A system. A scorched, airless rock battered by the K-dwarf's radiation and Astrophage alike. The Eridians surveyed this world early in their spacefaring history and found nothing of interest — too hot, too barren, too close to the star's Petrova Line to be safely approached without heavy shielding.
            radius         = 685000
            mass           = 7.94e22
            rotationPeriod = 1296000
            tidallyLocked  = true
            isHomeWorld    = false
            ScienceValues
            {
                flyingLowDataValue   = 0
                flyingHighDataValue  = 0
                inSpaceLowDataValue  = 7
                inSpaceHighDataValue = 4
                onGroundDataValue    = 10
                recoveryValue        = 3
                spaceAltitudeThreshold = 200000
            }
        }

        // ── Appearance from space: rust-red iron rock under K-dwarf orange light ─
        ScaledVersion
        {
            Material
            {
                texture    = ProjectHailMary/Textures/FortyEridaniI_color
                normals    = ProjectHailMary/Textures/FortyEridaniI_normal
                // Warm orange-red tint from 40 Eridani A's K-dwarf spectrum
                color      = 1.05, 0.90, 0.78, 1.0
                shininess  = 0.05
                specular   = 0.04, 0.02, 0.01, 1.0
            }
        }

        // ── Surface terrain ────────────────────────────────────────────────────
        PQS
        {
            Mods
            {
                VertexHeightMap
                {
                    map      = ProjectHailMary/Textures/FortyEridaniI_height
                    offset   = -2000
                    deformity = 8000
                    scaleDeformityByRadius = false
                    order    = 10
                    enabled  = true
                }
                VertexColorMap
                {
                    map     = ProjectHailMary/Textures/FortyEridaniI_color
                    order   = 100
                    enabled = true
                }
                // Iron-oxide micro-variation
                VertexSimplexNoiseColor
                {
                    seed        = 315
                    blend       = 0.14
                    colorStart  = 0.45, 0.16, 0.04, 1.0
                    colorEnd    = 0.88, 0.42, 0.14, 1.0
                    octaves     = 5.0
                    persistence = 0.56
                    frequency   = 22.0
                    order       = 200
                    enabled     = true
                }
            }
        }
    }
}

// ── Eridian Home / Erid (Rocky's homeworld) ───────────────────────────────────
// 40 Eridani b confirmed: 8.47 M_Earth, P = 42.37 d
// 28 atm ammonia/methane/nitrogen, 390K surface, pitch-black volcanic, near-lightless.
// THIS is the most alien world in the mod. Key visual: impenetrable orange-brown smog
// that blankets everything. Nothing reaches the surface. The world is a dark amber ball.
@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = EridianHome
        finalizeOrbit = false
        flightGlobalsIndex = 201

        Template
        {
            name = Eve
            removePQSMods = true
        }

        Orbit
        {
            referenceBody            = FortyEridani
            semiMajorAxis            = 6940000000
            eccentricity             = 0.05
            inclination              = 0.7
            meanAnomalyAtEpoch       = 1.9
            longitudeOfAscendingNode = 130.0
            argumentOfPeriapsis      = 55.0
            epoch                    = 0
            color                    = 0.78, 0.55, 0.22, 1.0
        }

        Properties
        {
            displayName    = Erid
            description    = The homeworld of the Eridian species — Rocky's planet. A crushing, lightless, boiling world beneath 28 atmospheres of ammonia, methane, and nitrogen. The dense smog blocks almost all light from 40 Eridani A; molten rivers provide the only illumination on the pitch-black volcanic surface. Surface temperature averages 390K. The Eridians evolved here, built a civilization here, and willingly left to cross 16 light-years in search of help for their dying star. Whether that says more about the universe or about Eridians is an open question.
            radius         = 1070000
            mass           = 4.482e23
            rotationPeriod = 82800
            tidallyLocked  = false
            initialRotation = 20
            isHomeWorld    = false
            ocean          = false
            atmosphere     = true
            timewarpAltitudeLimits = 0 1000 6000 20000 70000 130000 250000 500000
            ScienceValues
            {
                flyingLowDataValue   = 16
                flyingHighDataValue  = 12
                inSpaceLowDataValue  = 14
                inSpaceHighDataValue = 10
                onGroundDataValue    = 20
                recoveryValue        = 10
                spaceAltitudeThreshold = 500000
            }
        }

        Atmosphere
        {
            enabled          = true
            oxygen           = false
            altitude         = 100000
            atmosphereDepth  = 100000
            pressureCurve
            {
                key = 0       2837.0    0         0
                key = 7000    1040.0   -0.257    -0.257
                key = 21000    141.0   -0.0637   -0.0637
                key = 50000      2.5   -0.00500  -0.00500
                key = 100000     0      0         0
            }
            temperatureCurve
            {
                key = 0       390   0          0
                key = 20000   295  -0.00475   -0.00475
                key = 65000   240   0.00150    0.00150
                key = 100000  160   0          0
            }
            temperatureSunMultCurve
            {
                key = 0       1     0      0
                key = 100000  0     0      0
            }
            atmosphericMolarMass      = 0.018
            adiabaticIndex            = 1.28
            gasMassLapseRate          = 2
            atmospherePressureSeaLevel = 2837000

            AtmosphereFromGround
            {
                // DEEP ORANGE-AMBER: ammonia/methane smog fills everything.
                // R dominates, G moderate, B near-zero — matches book's dark amber sky.
                DEBUG_alwaysUpdateAll = false
                doScale              = true
                innerRadius          = 1070000
                invWaveLength        = 9.5, 5.5, 0.9, 0.5
                outerRadius          = 1160000
                samples              = 4
                scale                = 0.0000118
                scaleDepth           = 0.20
                scaleOverScaleDepth  = 0.0000590
                ESun                 = 22.0
                Kr                   = 0.0022
                Km                   = 0.0045
                g                    = -0.85
                waveLength           = 0.630, 0.570, 0.450, 0.0
                outerRadiusMult      = 1.0125
                innerRadiusMult      = 0.975
            }
        }

        // ── Appearance from space: impenetrable dark orange-brown smog ball ──────
        // The texture shows swirling ammonia cloud patterns.
        // Color multiplier keeps it dark — very little light penetrates.
        ScaledVersion
        {
            Material
            {
                texture    = ProjectHailMary/Textures/EridianHome_color
                normals    = ProjectHailMary/Textures/EridianHome_normal
                // Dark amber-brown — the smog barely reflects light
                color      = 0.90, 0.70, 0.38, 1.0
                shininess  = 0.10
                specular   = 0.08, 0.05, 0.02, 1.0
            }
        }

        // ── Surface terrain: pitch-black volcanic under the smog ──────────────
        PQS
        {
            Mods
            {
                VertexHeightMap
                {
                    map      = ProjectHailMary/Textures/EridianHome_height
                    offset   = -4000
                    deformity = 15000
                    scaleDeformityByRadius = false
                    order    = 10
                    enabled  = true
                }
                VertexColorMap
                {
                    map     = ProjectHailMary/Textures/EridianHome_color
                    order   = 100
                    enabled = true
                }
                // Lava-glow veins breaking through near-black rock
                VertexSimplexNoiseColor
                {
                    seed        = 867
                    blend       = 0.20
                    colorStart  = 0.35, 0.15, 0.02, 1.0
                    colorEnd    = 0.78, 0.32, 0.04, 1.0
                    octaves     = 4.0
                    persistence = 0.68
                    frequency   = 18.0
                    order       = 200
                    enabled     = true
                }
            }
        }
    }
}

