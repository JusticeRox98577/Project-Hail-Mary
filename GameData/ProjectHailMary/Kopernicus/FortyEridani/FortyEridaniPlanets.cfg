{
    Body
    {
        name = FortyEridaniIII
        finalizeOrbit = false
        flightGlobalsIndex = 203

        Template
        {
            name = Duna
            removePQSMods = false
        }

        Orbit
        {
            referenceBody            = FortyEridani
            semiMajorAxis            = 34000000000
            eccentricity             = 0.10
            inclination              = 2.0
            meanAnomalyAtEpoch       = 5.1
            longitudeOfAscendingNode = 180.0
            argumentOfPeriapsis      = 90.0
            epoch                    = 0
            color                    = 0.55, 0.48, 0.40, 1.0
        }

        Properties
        {
            displayName    = 40 Eridani III
            description    = A cold, dusty world in the outer 40 Eridani A system. Thin CO2 atmosphere, widespread permafrost, and ancient river channels speak to a warmer, wetter past. The Eridians surveyed it and found microbial fossils in subsurface ice — the only confirmed extraterrestrial life in their system. As Astrophage dims their sun, this world will freeze completely within 40 years. The Eridians named it in their pressure-language; the closest Kerbal translation is something like "Cold Memory."
            radius         = 380000
            mass           = 1.4e23
            rotationPeriod = 75600
            tidallyLocked  = false
            isHomeWorld    = false
            atmosphere     = true
            ScienceValues
            {
                flyingLowDataValue   = 7
                flyingHighDataValue  = 5
                inSpaceLowDataValue  = 8
                inSpaceHighDataValue = 5
                onGroundDataValue    = 12
                recoveryValue        = 6
                spaceAltitudeThreshold = 150000
            }
        }

        ScaledVersion
        {
            Material
            {
                color = 0.58, 0.50, 0.40, 1.0
            }
        }

        PQS
        {
            Mods
            {
                VertexSimplexNoiseColor
                {
                    seed        = 29
                    blend       = 0.75
                    colorStart  = 0.45, 0.35, 0.25, 1.0
                    colorEnd    = 0.68, 0.55, 0.42, 1.0
                    octaves     = 12.0
                    persistence = 0.5
                    frequency   = 2.5
                    order       = 200
                    enabled     = true
                }
            }
        }
    }
}
