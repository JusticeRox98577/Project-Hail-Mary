// Project Hail Mary - Tau Ceti Star
// Tau Ceti (HD 10700) is a G-type main-sequence star 11.9 light-years from Earth.
// It is slightly smaller and cooler than the Sun, with 78% of Sol's mass.
// Crucially, it is metal-poor — meaning fewer heavy elements, which in the book
// affects which organisms can survive there, explaining Astrophage dominance.
//
// In KSP, Tau Ceti is placed at an enormous distance from Kerbol to simulate
// interstellar travel. Requires Kopernicus mod (1.12.x compatible).

@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = TauCeti
        finalizeOrbit = false
        flightGlobalsIndex = 100

        Template
        {
            name = Sun
            removePQSMods = true
            removeAllPQSMods = true
        }

        Orbit
        {
            // ~12 light-years from Kerbol. 1 LY ≈ 9.46e15 m.
            // Compressed to ~1.8e13 m for KSP usability while retaining the feel
            // of an interstellar journey (warp/timewarp mandatory).
            referenceBody        = Sun
            semiMajorAxis        = 1.8e13
            eccentricity         = 0.0
            inclination          = 3.5
            meanAnomalyAtEpoch   = 0.9
            longitudeOfAscendingNode = 45.0
            argumentOfPeriapsis  = 0.0
            epoch                = 0
            color                = 1.0, 0.88, 0.65, 1.0
        }

        Properties
        {
            displayName        = Tau Ceti
            description        = A G-type main-sequence star 11.9 light-years from the Solar system. Slightly smaller, cooler, and more metal-poor than our own sun. Under normal circumstances, unremarkable. Under current circumstances — the star is being eaten alive by Astrophage. The Petrova Line here is forty times thicker than the one found around our own sun. Tau Ceti has perhaps 60 years of useful output remaining. The civilizations of this system sent a vessel toward our star in hope. We sent ours back in answer.
            radius             = 594000000       // 78% of Sol radius (Sol=695700km → ~542km; scaled to Kerbal units × ~1.1)
            mass               = 2.07e30         // 0.783 solar masses
            rotationPeriod     = 115200          // 32-hour rotation
            tidallyLocked      = false
            initialRotation    = 0
            isHomeWorld        = false
            timewarpAltitudeLimits = 0 5000 30000 30000 100000 300000 600000 1000000

            ScienceValues
            {
                flyingLowDataValue  = 0
                flyingHighDataValue = 0
                inSpaceLowDataValue  = 22
                inSpaceHighDataValue = 18
                recoveryValue        = 1
                spaceAltitudeThreshold = 2500000000
            }
        }

        ScaledVersion
        {
            type = Star
            fadeStart = 52000
            fadeEnd   = 55000

            Material
            {
                // A slightly orange-tinted G-type star
                _Color           = 1.0, 0.90, 0.72, 1.0
                _SpecColor       = 0.1, 0.1, 0.1, 1.0
                _Shininess       = 0.0
                _Rimpower        = 2.2
                _RimColor        = 1.0, 0.82, 0.55, 1.2
                _EmissionColor   = 1.0, 0.88, 0.65, 1.0
                texture          = Sun/Plugins/PluginData/SunTexture
                normals          = Sun/Plugins/PluginData/SunNormals
            }

            Light
            {
                sunlightColor          = 1.0, 0.95, 0.82, 1.0
                sunlightIntensity      = 0.88
                sunlightShadowStrength = 0.7523
                scaledSunlightColor    = 1.0, 0.95, 0.82, 1.0
                scaledSunlightIntensity = 0.88
                IVASunColor            = 1.0, 0.91, 0.76, 1.0
                IVASunIntensity        = 0.88
                ambientLightColor      = 0.10, 0.08, 0.06, 1.0
                sunLensFlareColor      = 1.0, 0.92, 0.72, 1.0
                givesOffLight          = true
                sunAU                  = 13599840256
                luminosity             = 0.52
                insolation             = 0.52
                brightnessMultiplier   = 1.0
            }

            Coronas
            {
                Corona
                {
                    speed      = 2.0
                    scaleLimitX = 7
                    scaleLimitY = 7
                    scaleSpeed = 0.006
                    texture    = Sun/Plugins/PluginData/SunCorona
                    rotation   = 0
                }
            }
        }

        Atmosphere
        {
            // Stars don't have atmospheres in KSP terms, but we set a corona zone
            enabled      = false
        }
    }
}
