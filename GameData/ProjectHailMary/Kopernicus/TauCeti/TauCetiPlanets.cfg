// Project Hail Mary — Tau Ceti Planetary System
// Visual overhaul: ScaledVersion textures + PQS color/height maps from DDS files.
// Parallax and EVE cloud configs live in separate files.
//
// Planet masses from Feng et al. 2017 (revised Tau Ceti candidates).
// Radii derived from mass-radius relation r/r_E = (m/m_E)^0.27 (rocky super-Earths).
// KSP scale factor: 600,000 m / 6,371 km = 0.09417 for radii, 0.00886 for masses.
// Orbital semi-major axes computed from real periods using Kepler's 3rd law
// with GM_TauCeti = 0.783 * GM_Kerbol.

// ── Tau Ceti b (innermost, scorched, airless) ─────────────────────────────────
// Real: 2.0 M_Earth, P = 13.9 d, a = 0.105 AU
@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = TauCetiB
        finalizeOrbit = false
        flightGlobalsIndex = 101

        Template
        {
            name = Moho
            removePQSMods = true
        }

        Orbit
        {
            referenceBody            = TauCeti
            semiMajorAxis            = 3225000000
            eccentricity             = 0.05
            inclination              = 1.2
            meanAnomalyAtEpoch       = 1.1
            longitudeOfAscendingNode = 70.0
            argumentOfPeriapsis      = 15.0
            epoch                    = 0
            color                    = 0.28, 0.27, 0.28, 1.0
        }

        Properties
        {
            displayName    = Tau Ceti b
            description    = The innermost world of the Tau Ceti system — a scorched, airless rock lacquered in impact craters. Surface temperature approaches 800K on the day side. Completely washed out by stellar glare in optical imaging. Nothing about this world is remarkable except how thoroughly destroyed it is.
            radius         = 730000
            mass           = 1.059e23
            rotationPeriod = 1200960
            tidallyLocked  = true
            isHomeWorld    = false
            ScienceValues
            {
                flyingLowDataValue   = 0
                flyingHighDataValue  = 0
                inSpaceLowDataValue  = 8
                inSpaceHighDataValue = 5
                onGroundDataValue    = 12
                recoveryValue        = 4
                spaceAltitudeThreshold = 250000
            }
        }

        // ── Appearance from space ──────────────────────────────────────────────
        ScaledVersion
        {
            Material
            {
                texture    = ProjectHailMary/Textures/TauCetiB_color
                normals    = ProjectHailMary/Textures/TauCetiB_normal
                color      = 1.0, 1.0, 1.0, 1.0
                shininess  = 0.04
                specular   = 0.02, 0.02, 0.02, 1.0
            }
        }

        // ── Surface terrain ────────────────────────────────────────────────────
        PQS
        {
            Mods
            {
                // Main terrain shape from world-map height data
                VertexHeightMap
                {
                    map      = ProjectHailMary/Textures/TauCetiB_height
                    offset   = -2000
                    deformity = 8000
                    scaleDeformityByRadius = false
                    order    = 10
                    enabled  = true
                }
                // World-map color as base
                VertexColorMap
                {
                    map     = ProjectHailMary/Textures/TauCetiB_color
                    order   = 100
                    enabled = true
                }
                // Subtle noise overlay for micro-color variation
                VertexSimplexNoiseColor
                {
                    seed        = 7
                    blend       = 0.12
                    colorStart  = 0.04, 0.04, 0.04, 1.0
                    colorEnd    = 0.28, 0.27, 0.28, 1.0
                    octaves     = 6.0
                    persistence = 0.5
                    frequency   = 20.0
                    order       = 200
                    enabled     = true
                }
            }
        }
    }
}

