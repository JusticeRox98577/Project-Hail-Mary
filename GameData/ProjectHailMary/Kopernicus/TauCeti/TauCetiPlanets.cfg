// Project Hail Mary - Tau Ceti Planetary System
// Real confirmed/candidate planets of Tau Ceti (as of discovery):
//   Tau Ceti b — 2.0 Earth masses, 0.105 AU (too hot, Mercury-like)
//   Tau Ceti c — 3.1 Earth masses, 0.195 AU (hot, Venus-like)
//   Tau Ceti d — 3.6 Earth masses, 0.374 AU (warm, inner habitable zone)
//   Tau Ceti e — 3.9 Earth masses, 0.538 AU (habitable zone)
//   Tau Ceti f — 6.6 Earth masses, 1.334 AU (outer habitable zone)
//   Tau Ceti g — 1.75 Earth masses, 0.133 AU (between b and c)
//
// NOTE: Rocky (the Eridian) is NOT from Tau Ceti. His species is native to
// the 40 Eridani system. Tau Ceti is where both the Hail Mary and Rocky's
// Blip-A rendezvoused to investigate the Astrophage infestation.
// All distances scaled down proportionally to match Kerbal system scale.

// ── Tau Ceti g (second innermost, tidal heating) ─────────────────────────────
@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = TauCetiG
        finalizeOrbit = false
        flightGlobalsIndex = 102

        Template
        {
            name = Moho
            removePQSMods = false
        }

        Orbit
        {
            referenceBody            = TauCeti
            semiMajorAxis            = 4000000000
            eccentricity             = 0.03
            inclination              = 0.8
            meanAnomalyAtEpoch       = 0.4
            longitudeOfAscendingNode = 55.0
            argumentOfPeriapsis      = 20.0
            epoch                    = 0
            color                    = 0.7, 0.4, 0.25, 1.0
        }

        Properties
        {
            displayName    = Tau Ceti g
            description    = A small, iron-rich world wedged between Tau Ceti b and c. Intense tidal heating from its eccentric orbit keeps the surface partially molten. Volcanic activity is constant. Any Astrophage here have evolved to survive extreme thermal cycling — a potentially unique strain worth studying.
            radius         = 280000
            mass           = 7.2e22
            rotationPeriod = 380000
            tidallyLocked  = true
            isHomeWorld    = false
            ScienceValues
            {
                flyingLowDataValue   = 0
                flyingHighDataValue  = 0
                inSpaceLowDataValue  = 6
                inSpaceHighDataValue = 4
                onGroundDataValue    = 9
                recoveryValue        = 3
                spaceAltitudeThreshold = 90000
            }
        }

        ScaledVersion
        {
            Material
            {
                color = 0.55, 0.25, 0.12, 1.0
            }
        }

        PQS
        {
            Mods
            {
                VertexSimplexNoiseColor
                {
                    seed        = 12
                    blend       = 0.8
                    colorStart  = 0.45, 0.15, 0.05, 1.0
                    colorEnd    = 0.80, 0.35, 0.10, 1.0
                    octaves     = 12.0
                    persistence = 0.5
                    frequency   = 3.0
                    order       = 200
                    enabled     = true
                }
            }
        }
    }
}

