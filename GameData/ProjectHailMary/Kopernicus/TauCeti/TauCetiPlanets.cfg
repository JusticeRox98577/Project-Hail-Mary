// Project Hail Mary - Tau Ceti Planetary System
// Real confirmed/candidate planets of Tau Ceti (as of discovery):
//   Tau Ceti b — 2.0 Earth masses, 0.105 AU (too hot, Mercury-like)
//   Tau Ceti c — 3.1 Earth masses, 0.195 AU (hot, Venus-like)
//   Tau Ceti d — 3.6 Earth masses, 0.374 AU (warm, inner habitable zone)
//   Tau Ceti e — 3.9 Earth masses, 0.538 AU (habitable zone — Rocky's home)
//   Tau Ceti f — 6.6 Earth masses, 1.334 AU (outer habitable zone)
//   Tau Ceti g — 1.75 Earth masses, 0.133 AU (between b and c)
//
// In the book, Tau Ceti e is home to the Eridians (Rocky's species).
// All distances scaled down proportionally to match Kerbal system scale.

// ── Tau Ceti b (innermost, scorched) ────────────────────────────────────────
@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = TauCetiB
        finalizeOrbit = false
        flightGlobalsIndex = 101

        Template
        {
            name = Moho
            removePQSMods = false
        }

        Orbit
        {
            referenceBody        = TauCeti
            semiMajorAxis        = 3200000000      // innermost, scorched
            eccentricity         = 0.05
            inclination          = 1.2
            meanAnomalyAtEpoch   = 1.1
            longitudeOfAscendingNode = 70.0
            argumentOfPeriapsis  = 15.0
            epoch                = 0
            color                = 0.85, 0.45, 0.2, 1.0
        }

        Properties
        {
            displayName        = Tau Ceti b
            description        = The innermost planet of the Tau Ceti system. A scorched, airless rock baked by stellar radiation and coated in Astrophage — the organisms can survive here in the Petrova Line's heart. Surface temperature approaches 800K on the day side. No useful resources. No reason to land.
            radius             = 350000
            mass               = 1.2e23
            rotationPeriod     = 520000
            tidallyLocked      = true
            isHomeWorld        = false
            ScienceValues
            {
                flyingLowDataValue   = 0
                flyingHighDataValue  = 0
                inSpaceLowDataValue  = 8
                inSpaceHighDataValue = 5
                onGroundDataValue    = 12
                recoveryValue        = 4
                spaceAltitudeThreshold = 120000
            }
        }

        ScaledVersion
        {
            Material
            {
                color = 0.82, 0.48, 0.28, 1.0
            }
        }
    }
}

// ── Tau Ceti e (Rocky's homeworld — habitable zone) ──────────────────────────
@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = TauCetiE
        finalizeOrbit = false
        flightGlobalsIndex = 105

        Template
        {
            name = Kerbin
            removePQSMods = false
        }

        Orbit
        {
            referenceBody        = TauCeti
            semiMajorAxis        = 16000000000     // habitable zone equivalent
            eccentricity         = 0.08
            inclination          = 0.5
            meanAnomalyAtEpoch   = 2.3
            longitudeOfAscendingNode = 120.0
            argumentOfPeriapsis  = 88.0
            epoch                = 0
            color                = 0.35, 0.62, 0.82, 1.0
        }

        Properties
        {
            displayName        = Tau Ceti e
            description        = Rocky's home. A rocky world in the habitable zone of Tau Ceti with a thick, nitrogen-rich atmosphere and liquid surface water. The Eridians — Rocky's species — evolved here, a civilization millions of years old. They breathe methane and "see" via an organ that generates sonar-like pressure waves. They are brilliant engineers, relentlessly curious, and fiercely loyal. Eridians call their star 40 Eridani in human catalogues, but are native to THIS system's equivalent. Eridians sent their Blip-A ships to investigate why Astrophage infests Tau Ceti so severely. One of them found the Hail Mary.
            radius             = 680000
            mass               = 6.3e23
            rotationPeriod     = 72000            // 20-hour day
            tidallyLocked      = false
            initialRotation    = 45
            isHomeWorld        = false
            atmosphere         = true
            timewarpAltitudeLimits = 0 1000 6000 20000 60000 100000 200000 400000

            ScienceValues
            {
                flyingLowDataValue   = 14
                flyingHighDataValue  = 10
                inSpaceLowDataValue  = 12
                inSpaceHighDataValue = 9
                onGroundDataValue    = 18
                recoveryValue        = 8
                spaceAltitudeThreshold = 400000
            }
        }

        Atmosphere
        {
            enabled          = true
            oxygen           = false            // methane/nitrogen mix, not breathable
            altitude         = 70000
            atmosphereDepth  = 70000
            pressureCurve
            {
                key = 0      101.325  0             0
                key = 9000   22.632   -0.008        -0.008
                key = 30000  1.2165   -0.0004       -0.0004
                key = 60000  0.0284   -0.0000125    -0.0000125
                key = 70000  0        0             0
            }
            temperatureCurve
            {
                key = 0      298   0        0
                key = 18000  218   -0.003   -0.003
                key = 55000  270   0.002    0.002
                key = 70000  180   0        0
            }
            temperatureSunMultCurve
            {
                key = 0      1     0      0
                key = 70000  0     0      0
            }
            atmosphericMolarMass = 0.028
            adiabaticIndex = 1.35
            gasMassLapseRate = 2
            atmospherePressureSeaLevel = 101325

            AtmosphereFromGround
            {
                DEBUG_alwaysUpdateAll = false
                doScale              = true
                innerRadius          = 680000
                invWaveLength        = 3.5, 5.5, 9.0, 0.5
                outerRadius          = 735000
                samples              = 4
                scale                = 0.00001125
                scaleDepth           = 0.25
                scaleOverScaleDepth  = 0.000045
                ESun                 = 15.0
                Kr                   = 0.00125
                Km                   = 0.0025
                g                    = -0.85
                waveLength           = 0.680, 0.530, 0.440, 0.0
                outerRadiusMult      = 1.0125
                innerRadiusMult      = 0.975
            }
        }

        ScaledVersion
        {
            Material
            {
                // A blue-tinted world with tan/brown continents — different from Kerbin
                color = 0.42, 0.56, 0.71, 1.0
            }
        }

        PQS
        {
            Mods
            {
                VertexColorMap
                {
                    map      = Squad/Terrain/KerbinTerrain/KerbinTextureColor
                    order    = 20
                    enabled  = true
                    name     = _Color
                }

                VertexHeightMap
                {
                    map          = Squad/Terrain/KerbinTerrain/KerbinTerrain
                    offset       = -1200
                    deformity    = 6000
                    scaleDeformityByRadius = false
                    order        = 20
                    enabled      = true
                }
            }
        }
    }
}

// ── Tau Ceti f (outer habitable zone — cold, icy) ────────────────────────────
@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = TauCetiF
        finalizeOrbit = false
        flightGlobalsIndex = 106

        Template
        {
            name = Duna
            removePQSMods = false
        }

        Orbit
        {
            referenceBody        = TauCeti
            semiMajorAxis        = 39500000000
            eccentricity         = 0.16
            inclination          = 2.1
            meanAnomalyAtEpoch   = 4.5
            longitudeOfAscendingNode = 200.0
            argumentOfPeriapsis  = 110.0
            epoch                = 0
            color                = 0.72, 0.56, 0.44, 1.0
        }

        Properties
        {
            displayName        = Tau Ceti f
            description        = The outer habitable zone planet of Tau Ceti. Cold and dry with a thin CO2 atmosphere, reminiscent of Mars but larger. Surface ice caps dominate the poles. As Tau Ceti dims due to Astrophage infestation, this planet will be the first to see its marginal habitability disappear entirely. Average surface temperature is already below 230K and falling.
            radius             = 540000
            mass               = 4.1e23
            rotationPeriod     = 87600
            tidallyLocked      = false
            isHomeWorld        = false
            atmosphere         = true
            ScienceValues
            {
                flyingLowDataValue   = 8
                flyingHighDataValue  = 6
                inSpaceLowDataValue  = 7
                inSpaceHighDataValue = 5
                onGroundDataValue    = 11
                recoveryValue        = 5
                spaceAltitudeThreshold = 200000
            }
        }
    }
}
