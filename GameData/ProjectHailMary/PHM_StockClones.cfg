// Project Hail Mary - Stock Part Clones
// Uses Module Manager +PART to create Hail Mary parts from stock visuals.
// No custom .mu files required — models are inherited from the cloned parts.
//
// Parts created:
//   phm_spin_drive_array      — S3 KS-25x4 "Mammoth" visual, Astrophage engine
//   phm_astrophage_tank_main  — Kerbodyne S3-14400 visual, Astrophage fuel tank
//
// NOTE: Astrophage resource is defined in Resources/Astrophage.cfg.
//       It is NOT redefined here to avoid duplicate-resource KSP warnings.
//
// Fuel consumption math at Isp 100,000 s / thrust 30,870 kN:
//   massFlow = 30,870,000 N / (100,000 s × 9.81 m/s²) = 31.47 kg/s = 0.03147 t/s
//   unitFlow = 0.03147 t/s / 0.001 t/unit = 31.47 units/s
//   Burn time (3 full tanks = 2,000,000 units): ~63,550 s ≈ 17.65 hours full throttle
//   Delta-v (dry 149 t / wet 2,149 t): 9.81 × 100,000 × ln(2149/149) ≈ 2,619 km/s
// KSP derives massFlow automatically from thrust + Isp — maxFuelFlow not needed.

// ── PHM-1009 Spin Drive Array ────────────────────────────────────────────────
// Cloned from: S3 KS-25x4 "Mammoth" Liquid Fuel Engine (Size3EngineCluster)
// The Mammoth's 4-nozzle cluster plate fits the aesthetic of 1,009 tightly-packed
// spin drives perfectly. No new model required.

+PART[Size3EngineCluster]:FIRST
{
    @name        = phm_spin_drive_array
    @title       = PHM-1009 "Spin Drive" Propulsion Array
    @manufacturer = Project Hail Mary Mission Authority
    @description = A massive engine plate housing 1,009 individual Spin Drive units. Each drive vaporizes Astrophage and emits stored energy as a directed photon stream — a photon rocket by any other name. Specific impulse is extraordinary. Thrust, while appearing modest on paper, is sufficient to push the entire Hail Mary at 1.5g when all 18 arrays are firing. Requires Astrophage fuel. Does not work in meaningful atmosphere — the photon exhaust interacts with air molecules and dissipates. This is a deep-space drive.

    @mass         = 20.0
    @maxTemp      = 3500
    @TechRequired = astrophagePropulsion
    @entryCost    = 950000
    @cost         = 480000

    @MODULE[ModuleEnginesFX],0
    {
        @maxThrust    = 30870
        @heatProduction = 60

        !PROPELLANT[*] {}

        PROPELLANT
        {
            name      = Astrophage
            ratio     = 1.0
            DrawGauge = True
        }

        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 100000
            key = 1 5000
            key = 4 0.001
        }
    }
}

// ── PHM Long-Range Astrophage Containment Tank ───────────────────────────────
// Cloned from: Kerbodyne S3-14400 Tank (Size3LargeTank)
// Three tanks carry the full canonical 2,000 t Astrophage load.
// (666,666 units × 3 tanks = 1,999,998 units ≈ 2,000 t at density 0.001)

+PART[Size3LargeTank]:FIRST
{
    @name        = phm_astrophage_tank_main
    @title       = PHM Long-Range Astrophage Containment Tank
    @manufacturer = Project Hail Mary Mission Authority
    @description = An insulated, internally heated tank designed to keep a living Astrophage colony alive across years of interstellar transit. Standard metallic containment fails — Astrophage migrate through any material when they detect a radiation gradient. This tank uses a tuned internal light source that creates a uniform radiation field, confusing the organisms into staying put. Engineering this took longer than designing the rest of the ship.

    @mass         = 25.0
    @TechRequired = astrophageCulture
    @entryCost    = 120000
    @cost         = 60000

    !RESOURCE[*] {}

    RESOURCE
    {
        name      = Astrophage
        amount    = 666666
        maxAmount = 666666
    }
}
