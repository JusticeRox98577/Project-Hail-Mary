// Project Hail Mary - Science Experiment Definitions

// ── Petrova Spectrometer ─────────────────────────────────────────────────────

EXPERIMENT_DEFINITION
{
    id = petrova_scan
    title = Petrova Astrophage Survey
    baseValue = 35
    scienceCap = 70
    dataScale = 1
    requireAtmosphere = false
    situationMask = 63
    biomeMask = 0

    RESULTS
    {
        default = The spectrometer detects no unusual infrared signature. No Astrophage present.

        // Kerbol / Sol system results
        SunInSpace0 = An extraordinary reading! A faint but unmistakable Astrophage infrared signature stretches in a band between the inner planets. The Petrova Line — here too? The implications are staggering.
        SunInSpace1 = Astrophage density drops off with distance from the star. The organisms cluster near the stellar feeding zone, consuming radiation.
        KerbinInSpace0 = No Astrophage signature detected in Kerbin orbit. The line is closer to Kerbol.
        KerbinInSpaceLow = Clean readings. Astrophage have not migrated this far from the star.
        EveInSpace0 = A trace signature! Faint traces of Astrophage clinging to the edges of Eve's orbit — the inner boundary of the Petrova equivalent line.
        EveInSpaceLow = Strong Astrophage readings! Eve's proximity to Kerbol places it squarely in the Petrova Line. The organisms are thick here.
        MohoInSpace0 = Intense Astrophage concentration. Moho's extreme proximity to Kerbol puts it deep within the feeding zone.

        // Tau Ceti system results
        TauCetiInSpace0 = The spectrometer goes off the charts. Astrophage density around Tau Ceti is catastrophic — this star is being consumed far faster than Kerbol. The Petrova Line here is orders of magnitude thicker. No wonder Tau Ceti e is in crisis.
        TauCetiInSpace1 = Even at this distance, Astrophage concentration is measurable. The organisms have spread throughout the inner Tau Ceti system.
        TauCetiEInSpaceLow = The planet below seems unaffected by Astrophage directly, but the star above dims noticeably. Rocky's home system is running out of time.
        TauCetiEOnSurface = Ground-based readings confirm the stellar dimming visible to the naked eye. Tau Ceti is losing output rapidly. Something different about this system allows Astrophage to thrive here without the natural control found in the Solar system.
    }
}

// ── Eridian Linguistics ──────────────────────────────────────────────────────

EXPERIMENT_DEFINITION
{
    id = eridian_linguistics
    title = Eridian Communication Attempt
    baseValue = 50
    scienceCap = 100
    dataScale = 1
    requireAtmosphere = false
    situationMask = 63
    biomeMask = 0

    RESULTS
    {
        default = No response. The universe remains silent.
        SunInSpace0 = Static. Perhaps other intelligences are not yet ready to make contact.
        TauCetiInSpace0 = The array crackles with pressure-wave pulses. A rhythm emerges — mathematical, deliberate. Someone is out there. First contact protocols are inadequate for what comes next.
        TauCetiEInSpaceLow = Chirps and clicks resolve into structured sequences. Rocky's species communicates through sound pressure directly — no vocal cords, no ears as we know them. The language barrier is immense but not insurmountable.
        TauCetiEOnSurface = Surface contact with what appear to be Eridian scout probes. No crew aboard — automated, sensing. They are watching.
    }
}

// ── Astrophage Culture Study ─────────────────────────────────────────────────

EXPERIMENT_DEFINITION
{
    id = astrophage_culture
    title = Astrophage Biological Study
    baseValue = 45
    scienceCap = 90
    dataScale = 1.5
    requireAtmosphere = false
    situationMask = 63
    biomeMask = 0

    RESULTS
    {
        default = The Astrophage culture is stable. Organisms reproduce steadily when exposed to stellar radiation.
        SunInSpace0 = Astrophage growth rate accelerates dramatically in close solar proximity. The organisms are feeding. Reproduction cycle measured at once per 37 hours in this environment.
        SunInSpace1 = Growth slows with distance. Optimal feeding range confirmed between 0.5 and 1.2 AU equivalent.
        KerbinInSpaceLow = Moderate growth. Organisms are healthy but not thriving — Kerbin is too far from Kerbol for peak efficiency.
        TauCetiInSpace0 = Explosive reproduction! Tau Ceti's radiation spectrum is nearly ideal for Astrophage metabolism. The organisms double every 6 hours here. This explains the catastrophic infestation.
        TauCetiEOnSurface = Astrophage introduced to surface conditions begin to slow. Something in the planetary environment — atmospheric chemistry, perhaps — is hostile to them. A lead worth pursuing.
    }
}
