// Project Hail Mary - Science Experiment Definitions

// ── Petrova Spectrometer ─────────────────────────────────────────────────────

EXPERIMENT_DEFINITION
{
    id = petrova_scan
    title = Petrova Astrophage Survey
    baseValue = 35
    scienceCap = 70
    dataScale = 1
    requireAtmosphere = false
    situationMask = 63
    biomeMask = 0

    RESULTS
    {
        default = The spectrometer detects no unusual infrared signature. No Astrophage present.

        // Kerbol / Sol system results
        SunInSpace0 = An extraordinary reading! A faint but unmistakable Astrophage infrared signature stretches in a band between the inner planets. The Petrova Line — here too? The implications are staggering.
        SunInSpace1 = Astrophage density drops off with distance from the star. The organisms cluster near the stellar feeding zone, consuming radiation.
        KerbinInSpace0 = No Astrophage signature detected in Kerbin orbit. The line is closer to Kerbol.
        KerbinInSpaceLow = Clean readings. Astrophage have not migrated this far from the star.
        EveInSpace0 = A trace signature! Faint traces of Astrophage clinging to the edges of Eve's orbit — the inner boundary of the Petrova equivalent line.
        EveInSpaceLow = Strong Astrophage readings! Eve's proximity to Kerbol places it squarely in the Petrova Line. The organisms are thick here.
        MohoInSpace0 = Intense Astrophage concentration. Moho's extreme proximity to Kerbol puts it deep within the feeding zone.

        // Tau Ceti system results
        TauCetiInSpace0 = The spectrometer goes off the charts. Astrophage density around Tau Ceti is catastrophic — this star is being consumed far faster than Kerbol. The Petrova Line here is orders of magnitude thicker. No wonder Tau Ceti e is in crisis.
        TauCetiInSpace1 = Even at this distance, Astrophage concentration is measurable. The organisms have spread throughout the inner Tau Ceti system.
        TauCetiBInSpaceLow = Extraordinary density here. Astrophage pack the space between Tau Ceti b and the star so densely the spectrometer saturates. The Petrova Line at its source.
        TauCetiBOnSurface = The entire sky glows faintly orange at night. Astrophage coating the surface rock re-emit stellar energy. A dead world, alive with organisms.
        TauCetiGInSpaceLow = Tidal heating keeps the surface partially molten — and Astrophage are somehow thriving in the heat vents. A thermophilic strain unlike anything catalogued near Kerbol.
        TauCetiCInSpaceLow = The cloud deck blazes with infrared. Astrophage in the upper atmosphere are so dense they're visible on long-exposure optical sensors. Tau Ceti c's clouds are literally alive.
        TauCetiDInSpaceLow = Moderate but measurable readings. Tau Ceti d sits at the inner habitable edge — warm enough for liquid water, warm enough for Astrophage. The infestation here is growing.
        TauCetiDOnSurface = The sun looks wrong from the surface. Tau Ceti's disk has a faint orange tinge visible to the naked eye — the Petrova Line from ground level. Colonists here would see the crisis happening in real time.
        TauCetiEInSpaceLow = The planet below seems unaffected by Astrophage directly, but the star above dims noticeably. Rocky's home system is running out of time.
        TauCetiEOnSurface = Ground-based readings confirm the stellar dimming visible to the naked eye. Tau Ceti is losing output rapidly. Something different about this system allows Astrophage to thrive here without the natural control found in the Solar system.
        TauCetiFInSpaceLow = Faint trace readings at this distance. The Astrophage are thin here, but the integrated stellar flux reduction is already measurable — Tau Ceti f will freeze within a century if the infestation isn't stopped.

        // 40 Eridani system results
        FortyEridaniInSpace0 = A second catastrophic reading. The Astrophage density around 40 Eridani rivals Tau Ceti — this star is being consumed at the same rate. The Eridians who sent Rocky here faced exactly the same crisis from the other side. Two civilizations, two dying stars, one desperate hope.
        FortyEridaniInSpace1 = Astrophage concentration drops with distance but remains elevated. The inner system is thick with organisms feeding on the K-dwarf's output.
        EridianHomeInSpaceLow = Moderate Astrophage density at this orbital distance. The organisms are present but not overwhelming — the same strange restraint observed at Tau Ceti e. Is this a coincidence, or a property of habitable-zone chemistry that naturally limits Astrophage growth?
        EridianHomeOnSurface = Ground-level readings from an alien world. The atmosphere filters most radiation, but the spectrometer still picks up Astrophage signatures in the stratosphere. Whatever lives here — whatever built the structures visible on the horizon — has been watching their star dim for decades.
        FortyEridaniIInSpaceLow = Maximum sensor saturation. This close to 40 Eridani, the Astrophage density is beyond the instrument's measurement range. The Petrova Line here is a wall of organisms.
    }
}

// ── Eridian Linguistics ──────────────────────────────────────────────────────

EXPERIMENT_DEFINITION
{
    id = eridian_linguistics
    title = Eridian Communication Attempt
    baseValue = 50
    scienceCap = 100
    dataScale = 1
    requireAtmosphere = false
    situationMask = 63
    biomeMask = 0

    RESULTS
    {
        default = No response. The universe remains silent.
        SunInSpace0 = Static. Perhaps other intelligences are not yet ready to make contact.
        TauCetiInSpace0 = The array crackles with pressure-wave pulses. A rhythm emerges — mathematical, deliberate. Someone is out there. First contact protocols are inadequate for what comes next.
        TauCetiEInSpaceLow = Chirps and clicks resolve into structured sequences. Rocky's species communicates through sound pressure directly — no vocal cords, no ears as we know them. The language barrier is immense but not insurmountable.
        TauCetiEOnSurface = Surface contact with what appear to be Eridian scout probes. No crew aboard — automated, sensing. They are watching.
        TauCetiDInSpaceLow = An intermittent signal. Not natural, not quite artificial. Something is here, but not communicating intentionally. Automated beacon, perhaps, or a passive reflection from Eridian infrastructure.
        TauCetiDOnSurface = Ground signal confirmed. An ancient structure of non-geological origin lies 40 km to the north. It predates any Kerbal civilization by millions of years. The universe is not empty.

        // 40 Eridani system results
        FortyEridaniInSpace0 = Contact. The Eridian communication array responds immediately. We are in their home system — they know we're here. Pressure-wave pulses wash over the sensor array in rhythmic patterns. Not a greeting exactly. More like: we see you. We've been waiting.
        EridianHomeInSpaceLow = The planet below is dense with Eridian signal traffic. Cities, infrastructure, a full technological civilization broadcasting on pressure-wave frequencies across the globe. And they know we're in orbit. The response time is measured in seconds. Rocky was not the last of his kind. His people are down there, watching.
        EridianHomeOnSurface = Surface contact is overwhelming. Eridian probes converge on the landing site within hours. They are sophisticated, curious, and patient. The communication protocols Rocky and Grace developed in the Tau Ceti encounter translate — roughly — to their home dialect. These beings have questions. So do we.
        FortyEridaniIIIOnSurface = A muted but unmistakable signal from beneath the permafrost. Not current transmission — a recording, preserved in ice for geological timescales. Eridian explorers were here long ago. The message, once decoded, is a survey log: "Life confirmed. Microbial. No contact possible. We will remember them."
    }
}

// ── Astrophage Culture Study ─────────────────────────────────────────────────

EXPERIMENT_DEFINITION
{
    id = astrophage_culture
    title = Astrophage Biological Study
    baseValue = 45
    scienceCap = 90
    dataScale = 1.5
    requireAtmosphere = false
    situationMask = 63
    biomeMask = 0

    RESULTS
    {
        default = The Astrophage culture is stable. Organisms reproduce steadily when exposed to stellar radiation.
        SunInSpace0 = Astrophage growth rate accelerates dramatically in close solar proximity. The organisms are feeding. Reproduction cycle measured at once per 37 hours in this environment.
        SunInSpace1 = Growth slows with distance. Optimal feeding range confirmed between 0.5 and 1.2 AU equivalent.
        KerbinInSpaceLow = Moderate growth. Organisms are healthy but not thriving — Kerbin is too far from Kerbol for peak efficiency.
        TauCetiInSpace0 = Explosive reproduction! Tau Ceti's radiation spectrum is nearly ideal for Astrophage metabolism. The organisms double every 6 hours here. This explains the catastrophic infestation.
        TauCetiCInSpaceLow = The culture samples nearly escape containment. Tau Ceti c's proximity to the star and thick Astrophage-laden atmosphere is the most favorable breeding environment yet encountered. Doubling time: under 2 hours.
        TauCetiEInSpaceLow = Growth rate is elevated but not catastrophic. Tau Ceti e is deep enough in the habitable zone to slow reproduction slightly. This could be significant — a zone where Astrophage are present but controllable.
        TauCetiEOnSurface = Astrophage introduced to surface conditions begin to slow. Something in the planetary environment — atmospheric chemistry, perhaps — is hostile to them. A lead worth pursuing.
        TauCetiFInSpaceLow = At this distance from Tau Ceti, the culture barely grows at all. The organisms prefer the inner system. This could explain why Tau Ceti f's biosphere, if any, has not yet been overwhelmed.

        // 40 Eridani system results
        FortyEridaniInSpace0 = Explosive growth — comparable to Tau Ceti's inner system. The K-dwarf's radiation spectrum is similarly favorable to Astrophage metabolism. Both stars are being consumed by the same organism responding to similar stellar chemistry. The parallelism is striking, and terrifying.
        EridianHomeInSpaceLow = Cultures placed in this orbital environment show moderate but controlled growth — similar to Tau Ceti e. The habitable zone seems to impose a natural limit. This cannot be coincidence. There is something in habitable-zone radiation environments that naturally suppresses Astrophage reproduction. This is the lead worth following.
        EridianHomeOnSurface = Cultures introduced to EridianHome's thick atmosphere show dramatic deceleration. Methane and ammonia chemistry in the lower atmosphere is directly hostile to Astrophage. The organisms die within hours of atmospheric exposure. The Eridians knew this. They used it. This is how they survived.
    }
}
