// Project Hail Mary — EVE Cloud / Atmosphere Layers
// Requires: Environmental Visual Enhancements (EVE) 1.10+ for KSP 1.12
// All blocks guarded by NEEDS[EnvironmentalVisualEnhancements].
//
// ── TEXTURE CHECKLIST ─────────────────────────────────────────────────────────
// Run  Tools/generate_terrain_textures.py  to generate cloud textures.
// Output location:  GameData/ProjectHailMary/Textures/EVE/
//
//   cloud_dense.dds     — thick cumulus/cumulonimbus (greyscale, white=opaque)
//   cloud_medium.dds    — moderate cloud cover
//   cloud_thin.dds      — wispy cirrus / sparse cover
//   cloud_detail.dds    — tiling cloud cell detail
//   smog_dense.dds      — uniform smog / haze (greyscale)
//   smog_detail.dds     — smog turbulence detail
//
// ── NOTES ─────────────────────────────────────────────────────────────────────
// Each body can have multiple OBJECT blocks (multiple cloud layers at different
// altitudes). The _Color setting tints the entire layer.
// rotationSpeed drives apparent planetary rotation of clouds (East-West).
// detailSpeed drives the internal cloud turbulence animation.
// ─────────────────────────────────────────────────────────────────────────────


// ══════════════════════════════════════════════════════════════════════════════
// ADRIAN / TAU CETI e — THE GREEN PLANET
// This is the visual centrepiece of the entire mod.
// Two cloud layers: the dense Astrophage biosphere + high-altitude haze.
// From orbit, the planet should look like a solid glowing lime-green sphere.
// ══════════════════════════════════════════════════════════════════════════════

EVE_CLOUDS:NEEDS[EnvironmentalVisualEnhancements]
{
    OBJECT
    {
        // Main Astrophage cloud deck — thick, covers the entire planet
        name        = TauCetiE-astrophage-main
        body        = TauCetiE
        altitude    = 45000

        settings
        {
            // SATURATED LIME GREEN — the book's defining visual
            _Color         = 0.28, 0.96, 0.12, 1.0
            _CloudOffset   = 0, 0, 0, 0
            _DetailDist    = 0.000002
            _MinLight      = 0.08
            _FalloffPow    = 2.0
            _FalloffScale  = 2.5
            _RimDist       = 0.0001
            _RimDistSub    = 1.01
        }

        detailSpeed  = 0.0018, 0.0018
        rotationSpeed = 0.0004

        MainTex
        {
            value    = ProjectHailMary/Textures/EVE/cloud_dense
            isClamped = false
            uScale   = 2
            vScale   = 1
        }

        DetailTex
        {
            value    = ProjectHailMary/Textures/EVE/cloud_detail
            isClamped = false
            uScale   = 10
            vScale   = 10
        }
    }
}

EVE_CLOUDS:NEEDS[EnvironmentalVisualEnhancements]
{
    OBJECT
    {
        // Upper Astrophage haze — paler, extends higher, gives the limb glow
        name        = TauCetiE-astrophage-upper
        body        = TauCetiE
        altitude    = 62000

        settings
        {
            // Paler green — thinner at this altitude
            _Color         = 0.18, 0.82, 0.08, 0.75
            _CloudOffset   = 0, 0, 0, 0
            _DetailDist    = 0.000003
            _MinLight      = 0.12
            _FalloffPow    = 1.8
            _FalloffScale  = 2.0
            _RimDist       = 0.0002
            _RimDistSub    = 1.008
        }

        detailSpeed  = 0.0025, 0.0025
        rotationSpeed = 0.0006

        MainTex
        {
            value    = ProjectHailMary/Textures/EVE/cloud_thin
            isClamped = false
            uScale   = 3
            vScale   = 1.5
        }

        DetailTex
        {
            value    = ProjectHailMary/Textures/EVE/cloud_detail
            isClamped = false
            uScale   = 8
            vScale   = 8
        }
    }
}


