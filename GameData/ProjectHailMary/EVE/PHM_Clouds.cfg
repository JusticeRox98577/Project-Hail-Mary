// Project Hail Mary — EVE Cloud / Atmosphere Layers
// Requires: Environmental Visual Enhancements Redux (EVE-Redux 1.11+) for KSP 1.12
// All blocks guarded by NEEDS[EnvironmentalVisualEnhancements].
//
// ── TEXTURE REFERENCE ─────────────────────────────────────────────────────────
// All textures live in GameData/ProjectHailMary/Textures/EVE/ as PNGs.
// EVE loads them via GameDatabase (no extension needed in texture paths).
// Regenerate textures: python Tools/generate_terrain_textures.py
//
//   cloud_dense.png   — large cloud mass regions, ~65% coverage, sharp edges
//   cloud_medium.png  — medium coverage ~45%, more visible gaps
//   cloud_thin.png    — high-contrast blobs, good for upper/sparse layers
//   cloud_detail.png  — fine swirling cells, tiled 12–16× for close-up detail
//   smog_dense.png    — near-opaque uniform smog, 68–100% coverage
//   smog_detail.png   — turbulence swirl for smog detail
//
// ── LAYER STRATEGY ────────────────────────────────────────────────────────────
// 4 layers per major planet at different altitudes + rotation speeds.
// Counter-rotating layers (negative rotationSpeed) create apparent depth.
// DetailTex uScale=12–16 gives extreme swirling detail on close approach.
// _DetailDist = 0.0000012 triggers detail texture at ~30–40 km from cloud deck.
// ─────────────────────────────────────────────────────────────────────────────


// ══════════════════════════════════════════════════════════════════════════════
// ADRIAN / TAU CETI e — THE GREEN PLANET
// Dense Astrophage biosphere cloud world. From orbit: glowing lime-green sphere.
// 4 layers at different altitudes and rotation speeds for deep Jool-like look.
// ══════════════════════════════════════════════════════════════════════════════

// ── Layer 1: Deep Astrophage cloud deck (lowest, densest, slowest) ────────────
EVE_CLOUDS:NEEDS[EnvironmentalVisualEnhancements]
{
    OBJECT
    {
        name        = TauCetiE-layer1-deep
        body        = TauCetiE
        altitude    = 28000

        settings
        {
            // Near-black green — dense, absorbs most light at depth
            _Color         = 0.12, 0.72, 0.08, 1.0
            _CloudOffset   = 0, 0, 0, 0
            _DetailDist    = 0.0000010
            _MinLight      = 0.06
            _FalloffPow    = 2.2
            _FalloffScale  = 2.8
            _RimDist       = 0.0001
            _RimDistSub    = 1.012
        }

        // Slowest rotation — deep cloud deck barely moves
        rotationSpeed = 0.00018
        detailSpeed   = 0.0012, 0.0008

        MainTex
        {
            value    = ProjectHailMary/Textures/EVE/cloud_dense
            isClamped = false
            uScale   = 2
            vScale   = 1
        }
        DetailTex
        {
            value    = ProjectHailMary/Textures/EVE/cloud_detail
            isClamped = false
            uScale   = 16
            vScale   = 16
        }
    }
}

