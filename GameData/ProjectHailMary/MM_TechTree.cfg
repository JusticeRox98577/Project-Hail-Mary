// Project Hail Mary - Tech Tree Integration
// Adds an Astrophage research branch to the stock tech tree.
// Requires Module Manager.

// ── New Tech Nodes ────────────────────────────────────────────────────────────

TECHNOLOGY
{
    id = astrophageBiology
    title = Astrophage Biology
    description = The discovery that Astrophage is a living organism changes everything. Understanding its biology is the first step toward using it — or stopping it.
    cost = 1000
    hideEmpty = false
    nodeName = node_a_astrophagebiology
    anyParent = false
    icon = RDicon_fuelSystems-advanced
    parents = advancedExploration
}

TECHNOLOGY
{
    id = astrophageCulture
    title = Astrophage Cultivation
    description = Breeding Astrophage in controlled conditions. The organisms are finicky — wrong temperature or light spectrum and they migrate through the tank walls. Getting this right required rebuilding tank metallurgy from scratch.
    cost = 2000
    hideEmpty = false
    nodeName = node_a_astrophageculture
    anyParent = false
    icon = RDicon_fuelSystems-advanced
    parents = astrophageBiology
}

TECHNOLOGY
{
    id = astrophagePropulsion
    title = Astrophage Photon Drive
    description = Astrophage can be induced to emit their stored energy in a single direction. The result is a photon rocket — the most efficient thruster ever built by any known civilization. Thrust is modest. Endurance is essentially unlimited.
    cost = 5000
    hideEmpty = false
    nodeName = node_a_astrophagepropulsion
    anyParent = false
    icon = RDicon_propulsion-advanced
    parents = astrophageCulture,nuclearPropulsion
}

TECHNOLOGY
{
    id = eridianTechnology
    title = Eridian Engineering
    description = The Eridians are a civilization millions of years older than ours. Their engineering operates on principles we are only beginning to understand. This node represents insights gained from Rocky's collaboration with Dr. Grace.
    cost = 8000
    hideEmpty = false
    nodeName = node_a_eridiantech
    anyParent = false
    icon = RDicon_advconstruction
    parents = astrophagePropulsion
}

// ── Part-to-Node Assignment Patches ──────────────────────────────────────────

@PART[petrova_spectrometer]:AFTER[ProjectHailMary]
{
    @TechRequired = astrophageBiology
}

@PART[astrophage_tank_small]:AFTER[ProjectHailMary]
{
    @TechRequired = astrophageCulture
}

@PART[astrophage_tank_large]:AFTER[ProjectHailMary]
{
    @TechRequired = astrophageCulture
}

@PART[astrophage_drive]:AFTER[ProjectHailMary]
{
    @TechRequired = astrophagePropulsion
}

@PART[hailmary_pod]:AFTER[ProjectHailMary]
{
    @TechRequired = astrophagePropulsion
}

@PART[rocky_comms_array]:AFTER[ProjectHailMary]
{
    @TechRequired = eridianTechnology
}

@PART[blipa_probe]:AFTER[ProjectHailMary]
{
    @TechRequired = eridianTechnology
}

@PART[phm_spin_drive_array]:AFTER[ProjectHailMary]
{
    @TechRequired = astrophagePropulsion
}

@PART[phm_astrophage_tank_main]:AFTER[ProjectHailMary]
{
    @TechRequired = astrophageCulture
}
