// Project Hail Mary - Parallax Continued Terrain Configs
// Requires: Parallax Continued 2.0+ (https://github.com/Gameslinx/Tessellation)
// All blocks are guarded by NEEDS[Parallax] — safe to have even without Parallax installed.
//
// ── TEXTURE CHECKLIST ─────────────────────────────────────────────────────────
// Create these DDS files (BC3/DXT5 compression, power-of-two, 2048×2048 recommended):
//
//   Textures/Parallax/
//     TauCetiE_low.dds          low-altitude surface (teal rock, wet stone)
//     TauCetiE_low_nrm.dds      normal map for above
//     TauCetiE_mid.dds          mid-altitude (dry teal-grey basalt)
//     TauCetiE_mid_nrm.dds
//     TauCetiE_high.dds         high-altitude (pale grey peaks)
//     TauCetiE_high_nrm.dds
//     TauCetiE_steep.dds        cliff faces (fractured dark rock)
//     TauCetiE_steep_nrm.dds
//
//     EridianHome_low.dds       low-altitude (amber clay, baked orange)
//     EridianHome_low_nrm.dds
//     EridianHome_mid.dds       mid-altitude (ochre basalt)
//     EridianHome_mid_nrm.dds
//     EridianHome_high.dds      high-altitude (pale tan ridge rock)
//     EridianHome_high_nrm.dds
//     EridianHome_steep.dds     steep cliffs (dark brown fractures)
//     EridianHome_steep_nrm.dds
//
//     TauCetiD_low.dds          warm tan desert
//     TauCetiD_low_nrm.dds
//     TauCetiD_steep.dds        sandstone cliffs
//     TauCetiD_steep_nrm.dds
//
//     TauCetiF_low.dds          pale blue-white ice
//     TauCetiF_low_nrm.dds
//     TauCetiF_steep.dds        ice-fracture cliffs
//     TauCetiF_steep_nrm.dds
//
// ── CREATING TEXTURES IN SUBSTANCE PAINTER / PHOTOSHOP ───────────────────────
// Each terrain zone needs: albedo (RGB color), normal map (DirectX convention,
// green channel NOT flipped), and optionally a height/displacement map.
// Export as DDS, BC3/DXT5 linear (not sRGB) for normal maps.
// Albedo maps use BC1/DXT1 (no alpha) or BC3/DXT5 (with alpha for transparency).

// ── Tau Ceti e ────────────────────────────────────────────────────────────────
@Parallax_Bodies:NEEDS[Parallax]:AFTER[Kopernicus]
{
    Body
    {
        planetName = TauCetiE

        terrainShaderProperties
        {
            // Tessellation — higher = more detail, more GPU cost
            _MaxTessellation       = 64
            _TessellationEdgeLength = 50
            _MaxTessellationRange  = 6000
            _MinTessellationRange  = 100

            // Low altitude zone (below ~300 m)
            _LowTexX          = ProjectHailMary/Textures/Parallax/TauCetiE_low
            _LowTexXScale     = 15
            _LowNormalX       = ProjectHailMary/Textures/Parallax/TauCetiE_low_nrm
            _LowNormalXScale  = 15
            _LowParallax      = 0.020

            // Mid altitude zone (300–900 m)
            _MidTexX          = ProjectHailMary/Textures/Parallax/TauCetiE_mid
            _MidTexXScale     = 15
            _MidNormalX       = ProjectHailMary/Textures/Parallax/TauCetiE_mid_nrm
            _MidNormalXScale  = 15
            _MidParallax      = 0.025

            // High altitude zone (above 900 m)
            _HighTexX         = ProjectHailMary/Textures/Parallax/TauCetiE_high
            _HighTexXScale    = 20
            _HighNormalX      = ProjectHailMary/Textures/Parallax/TauCetiE_high_nrm
            _HighNormalXScale = 20
            _HighParallax     = 0.030

            // Steep slopes
            _SteepTex         = ProjectHailMary/Textures/Parallax/TauCetiE_steep
            _SteepTexScale    = 10
            _SteepNormal      = ProjectHailMary/Textures/Parallax/TauCetiE_steep_nrm
            _SteepNormalScale = 10
            _SteepParallax    = 0.020

            // Zone blend heights (metres)
            _LowMidBlend      = 300
            _MidHighBlend     = 900
            _SteepPower       = 0.5

            // Overall color tint (RGBA)
            _Color            = 0.55, 0.75, 0.70, 1.0
        }

        Scatters
        {
            // Scattered rocks — sizes in metres, density 0-100
            Scatter
            {
                scatterName  = TauCetiE_rock_small
                mesh         = BUILTIN/boulder
                shader       = Parallax/Scatter/ParallaxScatterShader
                maxObjects   = 40
                noiseScale   = 3.0
                noiseCutoff  = 0.5
                steepLimit   = 0.6
                altitudeMin  = 0
                altitudeMax  = 900
                rangeLimit   = 1000
                minScale     = 0.1
                maxScale     = 0.6
                colorTint    = 0.35, 0.55, 0.50, 1.0
            }
            Scatter
            {
                scatterName  = TauCetiE_rock_large
                mesh         = BUILTIN/boulder
                shader       = Parallax/Scatter/ParallaxScatterShader
                maxObjects   = 15
                noiseScale   = 5.0
                noiseCutoff  = 0.7
                steepLimit   = 0.4
                altitudeMin  = 0
                altitudeMax  = 4000
                rangeLimit   = 2000
                minScale     = 1.0
                maxScale     = 4.0
                colorTint    = 0.30, 0.50, 0.45, 1.0
            }
        }
    }
}

// ── Eridian Home ─────────────────────────────────────────────────────────────
@Parallax_Bodies:NEEDS[Parallax]:AFTER[Kopernicus]
{
    Body
    {
        planetName = EridianHome

        terrainShaderProperties
        {
            _MaxTessellation       = 64
            _TessellationEdgeLength = 50
            _MaxTessellationRange  = 6000
            _MinTessellationRange  = 100

            _LowTexX          = ProjectHailMary/Textures/Parallax/EridianHome_low
            _LowTexXScale     = 12
            _LowNormalX       = ProjectHailMary/Textures/Parallax/EridianHome_low_nrm
            _LowNormalXScale  = 12
            _LowParallax      = 0.020

            _MidTexX          = ProjectHailMary/Textures/Parallax/EridianHome_mid
            _MidTexXScale     = 12
            _MidNormalX       = ProjectHailMary/Textures/Parallax/EridianHome_mid_nrm
            _MidNormalXScale  = 12
            _MidParallax      = 0.025

            _HighTexX         = ProjectHailMary/Textures/Parallax/EridianHome_high
            _HighTexXScale    = 18
            _HighNormalX      = ProjectHailMary/Textures/Parallax/EridianHome_high_nrm
            _HighNormalXScale = 18
            _HighParallax     = 0.030

            _SteepTex         = ProjectHailMary/Textures/Parallax/EridianHome_steep
            _SteepTexScale    = 8
            _SteepNormal      = ProjectHailMary/Textures/Parallax/EridianHome_steep_nrm
            _SteepNormalScale = 8
            _SteepParallax    = 0.025

            _LowMidBlend      = 350
            _MidHighBlend     = 1000
            _SteepPower       = 0.45

            // Warm amber-orange tint
            _Color            = 0.80, 0.60, 0.35, 1.0
        }

        Scatters
        {
            // Eridian-built structures — using large rock scatter as placeholder
            // Replace mesh with custom Eridian architecture .mu when available
            Scatter
            {
                scatterName  = EridianHome_rock
                mesh         = BUILTIN/boulder
                shader       = Parallax/Scatter/ParallaxScatterShader
                maxObjects   = 25
                noiseScale   = 4.0
                noiseCutoff  = 0.55
                steepLimit   = 0.5
                altitudeMin  = 0
                altitudeMax  = 1500
                rangeLimit   = 1200
                minScale     = 0.3
                maxScale     = 2.5
                colorTint    = 0.55, 0.38, 0.18, 1.0
            }
        }
    }
}

