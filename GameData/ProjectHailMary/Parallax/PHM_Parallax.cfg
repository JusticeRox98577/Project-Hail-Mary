// Project Hail Mary — Parallax Continued Terrain Configs
// Requires: Parallax Continued 2.0+ (https://github.com/Gameslinx/Tessellation)
// All blocks guarded by NEEDS[Parallax] — safe to have even without Parallax installed.
//
// ── TEXTURE CHECKLIST ─────────────────────────────────────────────────────────
// Run  Tools/generate_terrain_textures.py  to generate these files,
// then convert to DDS with texconv:
//
//   texconv -f DXT1 -o GameData/ProjectHailMary/Textures/Parallax/ Tools/terrain_src/*.png
//   texconv -f DXT5 -ddn -o GameData/ProjectHailMary/Textures/Parallax/ Tools/terrain_src/*_nrm.png
//
// Required DDS files (BC1 for albedo, BC3/DXT5nm for normals):
//   Textures/Parallax/
//     dark_basalt.dds / dark_basalt_nrm.dds        — TauCetiB, airless dark rock
//     volcanic_basalt.dds / volcanic_basalt_nrm.dds — TauCetiG low terrain
//     lava_rock.dds / lava_rock_nrm.dds             — TauCetiG steep/hot zones
//     acid_highland.dds / acid_highland_nrm.dds     — TauCetiC surface (unreachable)
//     charcoal_sand.dds / charcoal_sand_nrm.dds     — TauCetiD low plains
//     charcoal_cliff.dds / charcoal_cliff_nrm.dds   — TauCetiD steep faces
//     astrophage_wet.dds / astrophage_wet_nrm.dds   — TauCetiE low (wet Astrophage rock)
//     astrophage_mid.dds / astrophage_mid_nrm.dds   — TauCetiE mid altitude
//     astrophage_high.dds / astrophage_high_nrm.dds — TauCetiE high peaks
//     astrophage_cliff.dds / astrophage_cliff_nrm.dds — TauCetiE cliffs
//     ice_flat.dds / ice_flat_nrm.dds               — TauCetiF ice fields
//     ice_cliff.dds / ice_cliff_nrm.dds             — TauCetiF cliff faces
//     iron_basalt.dds / iron_basalt_nrm.dds         — FortyEridaniI
//     iron_steep.dds / iron_steep_nrm.dds           — FortyEridaniI cliffs
//     lava_basalt.dds / lava_basalt_nrm.dds         — EridianHome floor
//     lava_mid.dds / lava_mid_nrm.dds               — EridianHome mid
//     lava_high.dds / lava_high_nrm.dds             — EridianHome ridges
//     lava_cliff.dds / lava_cliff_nrm.dds           — EridianHome cliffs
//     frozen_dust.dds / frozen_dust_nrm.dds         — FortyEridaniIII flats
//     frozen_cliff.dds / frozen_cliff_nrm.dds       — FortyEridaniIII ridges
// ─────────────────────────────────────────────────────────────────────────────

// ── Tau Ceti b (scorched airless rock) ────────────────────────────────────────
@Parallax_Bodies:NEEDS[Parallax]:AFTER[Kopernicus]
{
    Body
    {
        planetName = TauCetiB

        terrainShaderProperties
        {
            _MaxTessellation        = 64
            _TessellationEdgeLength = 40
            _MaxTessellationRange   = 5000
            _MinTessellationRange   = 100

            // Flat basalt plains
            _LowTexX         = ProjectHailMary/Textures/Parallax/dark_basalt
            _LowTexXScale    = 12
            _LowNormalX      = ProjectHailMary/Textures/Parallax/dark_basalt_nrm
            _LowNormalXScale = 12
            _LowParallax     = 0.018

            // Mid terrain — same basalt, different scale for variety
            _MidTexX         = ProjectHailMary/Textures/Parallax/dark_basalt
            _MidTexXScale    = 18
            _MidNormalX      = ProjectHailMary/Textures/Parallax/dark_basalt_nrm
            _MidNormalXScale = 18
            _MidParallax     = 0.018

            // Crater rims
            _HighTexX         = ProjectHailMary/Textures/Parallax/dark_basalt
            _HighTexXScale    = 10
            _HighNormalX      = ProjectHailMary/Textures/Parallax/dark_basalt_nrm
            _HighNormalXScale = 10
            _HighParallax     = 0.022

            // Steep crater walls
            _SteepTex         = ProjectHailMary/Textures/Parallax/dark_basalt
            _SteepTexScale    = 8
            _SteepNormal      = ProjectHailMary/Textures/Parallax/dark_basalt_nrm
            _SteepNormalScale = 8
            _SteepParallax    = 0.022

            _LowMidBlend  = 400
            _MidHighBlend = 1200
            _SteepPower   = 0.45

            // Charcoal grey — extreme solar heating, zero albedo
            _Color = 0.22, 0.21, 0.22, 1.0
        }

        Scatters
        {
            // Impact ejecta boulders
            Scatter
            {
                scatterName = TauCetiB_ejecta
                mesh        = BUILTIN/boulder
                shader      = Parallax/Scatter/ParallaxScatterShader
                maxObjects  = 50
                noiseScale  = 4.0
                noiseCutoff = 0.55
                steepLimit  = 0.5
                altitudeMin = 0
                altitudeMax = 5000
                rangeLimit  = 800
                minScale    = 0.2
                maxScale    = 3.0
                colorTint   = 0.18, 0.17, 0.18, 1.0
            }
            // Larger primary impactors
            Scatter
            {
                scatterName = TauCetiB_boulder
                mesh        = BUILTIN/boulder
                shader      = Parallax/Scatter/ParallaxScatterShader
                maxObjects  = 12
                noiseScale  = 8.0
                noiseCutoff = 0.78
                steepLimit  = 0.35
                altitudeMin = 0
                altitudeMax = 6000
                rangeLimit  = 2000
                minScale    = 3.0
                maxScale    = 12.0
                colorTint   = 0.14, 0.13, 0.14, 1.0
            }
        }
    }
}

